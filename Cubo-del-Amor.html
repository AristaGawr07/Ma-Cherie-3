<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>💖 Cubo del Amor - Para Ti 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;500;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body {
            background: #000; color: white; font-family: 'Montserrat', sans-serif;
            height: 100vh; width: 100vw; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; overflow: hidden;
        }

        canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

        #love-message {
            position: fixed; top: 30px; font-family: 'Dancing Script', cursive;
            font-size: 2.2rem; color: #ff0077; text-shadow: 0 0 20px #ff0077;
            animation: pulse 2s infinite; display: none; z-index: 10; width: 100%; text-align: center;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 30px #ff0077; } }

        #btn-back {
            display: none; position: fixed;
            top: 15px; left: 15px;
            background: rgba(0,0,0,0.7); color: #fff; border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px; border-radius: 50px; font-size: 0.7rem; font-weight: 600;
            cursor: pointer; z-index: 1001; backdrop-filter: blur(5px); text-decoration: none;
        }
        #btn-back:hover { background: #ff0077; border-color: #ff0077; }

        #setup-form {
            z-index: 1000; background: rgba(15, 15, 15, 0.95); padding: 25px; border-radius: 25px;
            border: 1px solid #ff0077; text-align: center; width: 90%; max-width: 380px;
            box-shadow: 0 0 50px rgba(255, 0, 119, 0.2); position: absolute;
        }
        #setup-form h2 { color: #ff0077; margin-bottom: 10px; font-size: 1.3rem; }
        .section-title { font-size: 0.7rem; margin-top: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 2px; }
        .upload-box {
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.05); border: 2px dashed #ff0077;
            padding: 12px; border-radius: 12px; cursor: pointer; margin: 8px 0; transition: 0.3s;
        }
        .upload-box.done { border-style: solid; background: rgba(0, 255, 100, 0.1); border-color: #00ff66; }
        input[type="file"] { display: none; }
        .btn {
            background: linear-gradient(45deg, #ff0077, #ff5500); color: white; border: none; padding: 14px; margin-top: 15px;
            border-radius: 50px; font-weight: bold; cursor: pointer; width: 100%;
            box-shadow: 0 5px 20px rgba(255, 0, 119, 0.4); opacity: 0.5; pointer-events: none; transition: 0.3s;
        }
        .btn-surprise {
            background: linear-gradient(45deg, #ff0077, #ff5500); color: white; border: none; padding: 12px; margin-top: 8px;
            border-radius: 50px; font-weight: bold; cursor: pointer; width: 100%;
            box-shadow: 0 5px 20px rgba(255, 0, 119, 0.4); transition: 0.3s;
            font-size: 0.9rem;
        }
        .btn-surprise:hover { transform: scale(1.02); }

        #escena { display: none; width: 240px; height: 240px; margin: 0; }
        #cubo { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transform: rotateX(-15deg) rotateY(15deg); }
        .cara {
            position: absolute; width: 240px; height: 240px;
            border: 2px solid rgba(255, 0, 119, 0.6); box-shadow: 0 0 15px rgba(255,0,119,0.2);
            background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .cara img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .f { transform: rotateY(0deg) translateZ(120px); } .b { transform: rotateY(180deg) translateZ(120px); }
        .r { transform: rotateY(90deg) translateZ(120px); } .l { transform: rotateY(-90deg) translateZ(120px); }
        .u { transform: rotateX(90deg) translateZ(120px); } .d { transform: rotateX(-90deg) translateZ(120px); }

        /* ===== REPRODUCTOR MEJORADO ===== */
        #player {
            display: none; position: fixed; 
            bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 420px;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 18px;
            padding: 12px 16px;
            z-index: 100;
            border: 1px solid rgba(255, 0, 119, 0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .player-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .player-row-top {
            margin-bottom: 6px;
        }

        .player-row-bottom {
            gap: 8px;
        }

        .vinyl-mini {
            width: 38px; height: 38px; flex-shrink: 0;
            border-radius: 50%; border: 2px solid #333; 
            overflow: hidden; background: #000;
        }
        .vinyl-mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .vinyl-mini.spinning { animation: spin 3s linear infinite; border-color: #ff0077; box-shadow: 0 0 15px #ff0077; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #play-btn {
            background: white; color: #ff0077; border: none; width: 36px; height: 36px; flex-shrink: 0;
            border-radius: 50%; font-size: 1rem; cursor: pointer;
            box-shadow: 0 0 20px rgba(255,255,255,0.2); transition: 0.2s;
        }
        #play-btn.playing { box-shadow: 0 0 25px #ff0077; background: #ff0077; color: white; }

        .progress-container {
            flex: 1;
            min-width: 80px;
        }
        .progress-area {
            width: 100%; height: 4px; background: rgba(255,255,255,0.15); border-radius: 10px; cursor: pointer; position: relative;
        }
        .progress-bar {
            height: 100%; width: 0%; background: linear-gradient(90deg, #ff0077, #ff5500); border-radius: 10px;
        }
        .time-display {
            font-size: 0.55rem; color: #888; display: flex; justify-content: space-between; margin-top: 2px;
        }

        .volume-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .volume-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .volume-btn:hover { background: rgba(255,0,119,0.3); }
        .volume-slider {
            width: 50px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff0077;
            cursor: pointer;
        }
        .volume-slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff0077;
            cursor: pointer;
            border: none;
        }

        .visualizer-mini {
            display: flex;
            gap: 2px;
            height: 18px;
            align-items: flex-end;
            flex-shrink: 0;
        }
        .bar-mini {
            width: 3px; background: #ff0077; border-radius: 2px; height: 3px; transition: 0.1s;
        }
        .playing .bar-mini { animation: bounceMini 0.4s infinite ease-in-out alternate; }
        .bar-mini:nth-child(2) { animation-delay: 0.1s; } .bar-mini:nth-child(3) { animation-delay: 0.2s; }
        .bar-mini:nth-child(4) { animation-delay: 0.3s; } .bar-mini:nth-child(5) { animation-delay: 0.15s; }
        @keyframes bounceMini {
            0% { height: 3px; opacity: 0.5; }
            100% { height: 16px; opacity: 1; }
        }

        .song-title-mini {
            color: rgba(255,255,255,0.4);
            font-size: 0.55rem;
            text-align: center;
            letter-spacing: 1px;
            font-weight: 300;
            margin-top: 4px;
        }

        .status-surprise {
            margin-top: 5px;
            font-size: 0.75rem;
            color: #ff0077;
            min-height: 18px;
        }

        #btn-download {
            display: none; position: fixed; 
            bottom: 85px;
            background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 20px; border-radius: 50px; font-size: 0.7rem; font-weight: 600;
            cursor: pointer; z-index: 1001; backdrop-filter: blur(5px);
        }
        #btn-download:hover { background: #ff0077; border-color: #ff0077; }

        /* Mensajes de error */
        .error-msg {
            color: #ff4444;
            font-size: 0.55rem;
            text-align: center;
            display: none;
        }
        .loading-msg {
            color: #ffaa00;
            font-size: 0.55rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="cv"></canvas>
    <div id="love-message">💖 Para ti, con amor 💖</div>

    <a href="index.html" id="btn-back">📚 Volver</a>

    <div id="setup-form">
        <h2>💝 Crea tu Regalo</h2>
        <div class="section-title">📸 1. Selecciona 6 Fotos</div>
        <label class="upload-box" id="box-img" for="file-input">
            <span id="status-img">📁 Abrir Galería</span>
            <input type="file" id="file-input" accept="image/*" multiple>
        </label>
        
        <div class="section-title">🎵 2. Canción Sorpresa</div>
        <button id="surprise-btn" class="btn-surprise">🎁 ¡Sorpresa!</button>
        <div id="surprise-status" class="status-surprise">Haz clic para elegir una canción</div>
        
        <button id="start-btn" class="btn">✨ CREAR MAGIA ✨</button>
    </div>

    <div id="escena">
        <div id="cubo">
            <div class="cara f"><img id="img0"></div><div class="cara b"><img id="img1"></div>
            <div class="cara r"><img id="img2"></div><div class="cara l"><img id="img3"></div>
            <div class="cara u"><img id="img4"></div><div class="cara d"><img id="img5"></div>
        </div>
    </div>

    <audio id="audio-element" loop></audio>
    
    <div id="player">
        <!-- Fila 1: Controles principales -->
        <div class="player-row player-row-top">
            <div class="vinyl-mini" id="vinyl"><img id="vinyl-img" alt="cover"></div>
            <button id="play-btn">▶</button>
            
            <div class="progress-container">
                <div class="progress-area" id="progress-area">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="time-display">
                    <span id="curr-time">0:00</span>
                    <span id="dur-time">0:00</span>
                </div>
            </div>
            
            <div class="visualizer-mini" id="visualizer">
                <div class="bar-mini"></div><div class="bar-mini"></div>
                <div class="bar-mini"></div><div class="bar-mini"></div>
                <div class="bar-mini"></div>
            </div>
        </div>
        
        <!-- Fila 2: Volumen + info -->
        <div class="player-row player-row-bottom">
            <div class="volume-group">
                <button class="volume-btn" id="vol-down">−</button>
                <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="100">
                <button class="volume-btn" id="vol-up">+</button>
                <span style="font-size:0.55rem;color:#888;min-width:28px;" id="volume-label">100%</span>
            </div>
            
            <div style="flex:1; text-align:center;">
                <span class="song-title-mini" id="song-title">🎵 Canción de amor</span>
            </div>
            
            <div>
                <button id="change-song-btn" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);color:white;padding:3px 10px;border-radius:15px;font-size:0.55rem;cursor:pointer;font-family:'Montserrat',sans-serif;">🔄</button>
            </div>
        </div>
        
        <div class="error-msg" id="audio-error">⚠️ No se pudo cargar la canción</div>
        <div class="loading-msg" id="loading-msg">⏳ Cargando música...</div>
    </div>

    <button id="btn-download">💾 GUARDAR</button>

    <script>
        // --- CANCIONES ---
        const SONG_URLS = [
            'https://files.catbox.moe/pgafel.mp3',
            'https://files.catbox.moe/3py8bs.mp3',
            'https://voca.ro/13bZbGNbYCwL',
            'https://voca.ro/1bHR9tEGL03i'
        ];

        const SONG_NAMES = ['🎵 Canción 1', '🎵 Canción 2', '🎵 Canción 3', '🎵 Canción 4'];

        // --- ELEMENTOS ---
        const canvas = document.getElementById('cv'), ctx = canvas.getContext('2d');
        const cubo = document.getElementById('cubo');
        const audio = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-btn');
        const progressBar = document.getElementById('progress-bar');
        const progressArea = document.getElementById('progress-area');
        const currTime = document.getElementById('curr-time');
        const durTime = document.getElementById('dur-time');
        const vinyl = document.getElementById('vinyl');
        const vinylImg = document.getElementById('vinyl-img');
        const visualizer = document.getElementById('visualizer');
        const surpriseBtn = document.getElementById('surprise-btn');
        const surpriseStatus = document.getElementById('surprise-status');
        const songTitle = document.getElementById('song-title');
        const audioError = document.getElementById('audio-error');
        const loadingMsg = document.getElementById('loading-msg');
        const changeSongBtn = document.getElementById('change-song-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeLabel = document.getElementById('volume-label');
        const volDown = document.getElementById('vol-down');
        const volUp = document.getElementById('vol-up');

        let compressedImages = [], particles = [];
        let isDragging = false, rotX = -15, rotY = 15, lastX, lastY, vx = 0;
        let imgReady = false, audReady = false;
        let selectedSongUrl = '';
        let selectedSongIndex = 0;
        let isPlaying = false;
        let audioLoaded = false;

        // --- PARTÍCULAS ---
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        class Particle {
            constructor() { this.init(); this.y = Math.random() * canvas.height; }
            init() { this.x = Math.random() * canvas.width; this.y = canvas.height + 50; this.s = Math.random() * 15 + 10; this.v = Math.random() * 1.5 + 0.5; this.t = Math.random() > 0.5 ? '❤️' : '🌸'; this.o = Math.random() * 0.5 + 0.1; }
            draw() {
                this.x += vx * 0.4; this.y -= this.v; 
                if(this.y < -50 || this.x < -50 || this.x > canvas.width + 50) this.init();
                ctx.globalAlpha = this.o; ctx.font = `${this.s}px serif`; ctx.fillText(this.t, this.x, this.y);
            }
        }
        for(let i=0; i<100; i++) particles.push(new Particle());

        function loop() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach(p => p.draw());
            if (!isDragging && document.getElementById('escena').style.display === 'block') { rotY += 0.2; vx *= 0.95; }
            if (document.getElementById('escena').style.display === 'block') cubo.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            
            if(!audio.paused && audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = `${pct}%`;
                currTime.innerText = formatTime(audio.currentTime);
            }
            requestAnimationFrame(loop);
        }
        loop();

        function formatTime(s) { const m = Math.floor(s/60), se = Math.floor(s%60); return m+":"+(se<10?'0'+se:se); }

        // --- CARGAR AUDIO ---
        function loadAudio() {
            if (!selectedSongUrl) return;
            
            audioError.style.display = 'none';
            loadingMsg.style.display = 'block';
            audioLoaded = false;
            
            audio.pause();
            playBtn.innerHTML = "▶";
            playBtn.classList.remove('playing');
            vinyl.classList.remove('spinning');
            visualizer.classList.remove('playing');
            isPlaying = false;
            
            audio.src = selectedSongUrl;
            audio.load();
            
            audio.onloadedmetadata = function() {
                durTime.innerText = formatTime(audio.duration);
                audioLoaded = true;
                loadingMsg.style.display = 'none';
                audioError.style.display = 'none';
                songTitle.textContent = SONG_NAMES[selectedSongIndex] || '🎵 Canción de amor';
                
                setTimeout(() => {
                    if (!isPlaying) {
                        togglePlay();
                    }
                }, 500);
            };
            
            audio.onerror = function() {
                loadingMsg.style.display = 'none';
                audioError.style.display = 'block';
                audioLoaded = false;
            };
        }

        function togglePlay() {
            if (!audioLoaded) {
                loadAudio();
                return;
            }
            if(audio.paused) { 
                audio.play().catch(() => {
                    audioError.style.display = 'block';
                });
                playBtn.innerHTML = "⏸"; 
                playBtn.classList.add('playing'); 
                vinyl.classList.add('spinning'); 
                visualizer.classList.add('playing'); 
                isPlaying = true;
            } else { 
                audio.pause(); 
                playBtn.innerHTML = "▶"; 
                playBtn.classList.remove('playing'); 
                vinyl.classList.remove('spinning'); 
                visualizer.classList.remove('playing'); 
                isPlaying = false;
            }
        }

        playBtn.addEventListener('click', togglePlay);

        // --- PROGRESO ---
        progressArea.addEventListener('click', (e) => { 
            const rect = progressArea.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const d = audio.duration;
            if(d) audio.currentTime = x * d;
        });

        // --- VOLUMEN ---
        function updateVolume(val) {
            const v = val / 100;
            audio.volume = v;
            volumeLabel.textContent = Math.round(val) + '%';
        }

        volumeSlider.addEventListener('input', function() {
            updateVolume(this.value);
        });

        volDown.addEventListener('click', () => {
            let v = parseInt(volumeSlider.value) - 10;
            if(v < 0) v = 0;
            volumeSlider.value = v;
            updateVolume(v);
        });

        volUp.addEventListener('click', () => {
            let v = parseInt(volumeSlider.value) + 10;
            if(v > 100) v = 100;
            volumeSlider.value = v;
            updateVolume(v);
        });

        // --- SELECCIONAR CANCIÓN ---
        function selectRandomSong() {
            selectedSongIndex = Math.floor(Math.random() * SONG_URLS.length);
            selectedSongUrl = SONG_URLS[selectedSongIndex];
            surpriseStatus.textContent = `🎵 Canción ${selectedSongIndex + 1}/${SONG_URLS.length}`;
            surpriseStatus.style.color = '#00ff66';
            songTitle.textContent = '⏳ Cargando...';
            audReady = true;
            check();
            
            // Pre-cargar
            const testAudio = new Audio();
            testAudio.src = selectedSongUrl;
            testAudio.onloadedmetadata = function() {
                console.log('✅ Canción pre-cargada');
                testAudio.src = '';
            };
            setTimeout(() => { testAudio.src = ''; }, 3000);
        }

        surpriseBtn.addEventListener('click', selectRandomSong);
        changeSongBtn.addEventListener('click', selectRandomSong);

        // --- IMÁGENES ---
        function check() { if(imgReady && audReady) { const b = document.getElementById('start-btn'); b.style.opacity="1"; b.style.pointerEvents="all"; } }
        
        document.getElementById('file-input').addEventListener('change', async (e) => {
            if(e.target.files.length !== 6) return alert("Selecciona 6 fotos");
            document.getElementById('status-img').innerText = "Procesando...";
            compressedImages = [];
            for(let f of e.target.files) compressedImages.push(await compress(f));
            document.getElementById('status-img').innerText = "¡Fotos Listas!"; 
            document.getElementById('box-img').classList.add('done'); 
            imgReady = true; 
            check();
        });

        function compress(file) {
            return new Promise((res) => {
                const r = new FileReader(); r.readAsDataURL(file);
                r.onload = (e) => {
                    const i = new Image(); i.src = e.target.result;
                    i.onload = () => { 
                        const c = document.createElement('canvas'); 
                        c.width = 400; c.height = 400; 
                        const x = c.getContext('2d'); 
                        const s = Math.max(400/i.width, 400/i.height); 
                        x.drawImage(i, (400-i.width*s)/2, (400-i.height*s)/2, i.width*s, i.height*s); 
                        res(c.toDataURL('image/jpeg', 0.7)); 
                    }
                }
            });
        }

        // --- INICIAR ---
        document.getElementById('start-btn').addEventListener('click', () => {
            if (!selectedSongUrl) {
                alert('Primero elige una canción sorpresa con el botón "¡Sorpresa!"');
                return;
            }
            compressedImages.forEach((s, i) => document.getElementById(`img${i}`).src = s);
            vinylImg.src = compressedImages[0];
            
            document.getElementById('setup-form').style.display = "none";
            document.getElementById('escena').style.display = "block";
            document.getElementById('btn-download').style.display = "block";
            document.getElementById('btn-back').style.display = "block";
            document.getElementById('love-message').style.display = "block";
            document.getElementById('player').style.display = "block";
            
            loadAudio();
        });

        // --- INTERACCIÓN 3D ---
        const start = (e) => { isDragging = true; lastX = e.pageX || e.touches[0].pageX; lastY = e.pageY || e.touches[0].pageY; };
        const end = () => { isDragging = false; };
        const move = (e) => { if (!isDragging) return; const x = e.pageX || e.touches[0].pageX; const y = e.pageY || e.touches[0].pageY; vx = x - lastX; rotY += vx * 0.5; rotX -= (y - lastY) * 0.5; lastX = x; lastY = y; };
        window.addEventListener('mousedown', start); window.addEventListener('touchstart', start);
        window.addEventListener('mousemove', move); window.addEventListener('touchmove', move);
        window.addEventListener('mouseup', end); window.addEventListener('touchend', end);

        // --- DESCARGAR ---
        document.getElementById('btn-download').addEventListener('click', () => {
            const template = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>💖 Cubo del Amor - Para Ti 💖</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
        body{background:#000;color:white;font-family:'Montserrat',sans-serif;height:100vh;width:100vw;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
        canvas{position:fixed;inset:0;z-index:-1;pointer-events:none}
        #msg{position:fixed;top:30px;font-family:'Dancing Script',cursive;font-size:2.2rem;color:#ff0077;text-shadow:0 0 20px #ff0077;animation:p 2s infinite;z-index:10;width:100%;text-align:center}
        @keyframes p{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.05);opacity:1;text-shadow:0 0 30px #ff0077}}
        #escena{width:240px;height:240px;margin:0}
        #cubo{width:100%;height:100%;position:relative;transform-style:preserve-3d}
        .cara{position:absolute;width:240px;height:240px;border:2px solid rgba(255,0,119,0.6);box-shadow:0 0 15px rgba(255,0,119,0.2);background:#000;display:flex;justify-content:center;align-items:center;overflow:hidden}
        .cara img{width:100%;height:100%;object-fit:cover;pointer-events:none}
        .f{transform:rotateY(0deg) translateZ(120px)}.b{transform:rotateY(180deg) translateZ(120px)}
        .r{transform:rotateY(90deg) translateZ(120px)}.l{transform:rotateY(-90deg) translateZ(120px)}
        .u{transform:rotateX(90deg) translateZ(120px)}.d{transform:rotateX(-90deg) translateZ(120px)}
        
        #pl{display:block;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:92%;max-width:420px;background:rgba(10,10,10,0.92);backdrop-filter:blur(20px);border-radius:18px;padding:12px 16px;z-index:100;border:1px solid rgba(255,0,119,0.2);box-shadow:0 10px 40px rgba(0,0,0,0.8)}
        .pr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
        .prt{margin-bottom:6px}
        .prb{gap:8px}
        .vm{width:38px;height:38px;flex-shrink:0;border-radius:50%;border:2px solid #333;overflow:hidden;background:#000}
        .vm img{width:100%;height:100%;object-fit:cover;display:block}
        .vm.sp{animation:sp 3s linear infinite;border-color:#ff0077;box-shadow:0 0 15px #ff0077}@keyframes sp{100%{transform:rotate(360deg)}}
        #pb{background:white;color:#ff0077;border:none;width:36px;height:36px;flex-shrink:0;border-radius:50%;font-size:1rem;cursor:pointer;box-shadow:0 0 20px rgba(255,255,255,0.2);transition:.2s}
        #pb.pg{box-shadow:0 0 25px #ff0077;background:#ff0077;color:white}
        .pc{flex:1;min-width:80px}
        .pa{width:100%;height:4px;background:rgba(255,255,255,0.15);border-radius:10px;cursor:pointer;position:relative}
        .pb{height:100%;width:0%;background:linear-gradient(90deg,#ff0077,#ff5500);border-radius:10px}
        .td{font-size:.55rem;color:#888;display:flex;justify-content:space-between;margin-top:2px}
        .vg{display:flex;align-items:center;gap:4px;flex-shrink:0}
        .vb{background:rgba(255,255,255,0.08);border:none;color:white;width:24px;height:24px;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .vb:hover{background:rgba(255,0,119,0.3)}
        .vs{width:50px;height:3px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.2);border-radius:2px;outline:none;cursor:pointer}
        .vs::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;border-radius:50%;background:#ff0077;cursor:pointer}
        .vs::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#ff0077;cursor:pointer;border:none}
        .vmz{display:flex;gap:2px;height:18px;align-items:flex-end;flex-shrink:0}
        .bm{width:3px;background:#ff0077;border-radius:2px;height:3px;transition:.1s}
        .pg .bm{animation:bm 0.4s infinite ease-in-out alternate}
        .bm:nth-child(2){animation-delay:.1s}.bm:nth-child(3){animation-delay:.2s}
        .bm:nth-child(4){animation-delay:.3s}.bm:nth-child(5){animation-delay:.15s}
        @keyframes bm{0%{height:3px;opacity:.5}100%{height:16px;opacity:1}}
        .st{color:rgba(255,255,255,0.4);font-size:.55rem;text-align:center;letter-spacing:1px;font-weight:300;margin-top:4px}
        .er{color:#ff4444;font-size:.55rem;text-align:center;display:none}
        .ld{color:#ffaa00;font-size:.55rem;text-align:center;display:none}
    </style>
</head>
<body>
    <canvas id="cv"></canvas>
    <div id="msg">💖 Para ti, con amor 💖</div>
    <div id="escena"><div id="cubo">
        <div class="cara f"><img src="${compressedImages[0]}"></div>
        <div class="cara b"><img src="${compressedImages[1]}"></div>
        <div class="cara r"><img src="${compressedImages[2]}"></div>
        <div class="cara l"><img src="${compressedImages[3]}"></div>
        <div class="cara u"><img src="${compressedImages[4]}"></div>
        <div class="cara d"><img src="${compressedImages[5]}"></div>
    </div></div>
    <audio id="au" loop src="${selectedSongUrl}"></audio>
    <div id="pl">
        <div class="pr prt">
            <div class="vm" id="vm"><img src="${compressedImages[0]}"></div>
            <button id="pb">▶</button>
            <div class="pc">
                <div class="pa" id="pa"><div class="pb" id="pb2"></div></div>
                <div class="td"><span id="ct">0:00</span><span id="dt">0:00</span></div>
            </div>
            <div class="vmz" id="vmz"><div class="bm"></div><div class="bm"></div><div class="bm"></div><div class="bm"></div><div class="bm"></div></div>
        </div>
        <div class="pr prb">
            <div class="vg">
                <button class="vb" id="vd">−</button>
                <input type="range" class="vs" id="vs" min="0" max="100" value="100">
                <button class="vb" id="vu">+</button>
                <span style="font-size:.55rem;color:#888;min-width:28px;" id="vl">100%</span>
            </div>
            <div style="flex:1;text-align:center;"><span class="st" id="st">${SONG_NAMES[selectedSongIndex] || '🎵 Canción de amor'}</span></div>
        </div>
        <div class="er" id="er">⚠️ No se pudo cargar la canción</div>
        <div class="ld" id="ld">⏳ Cargando música...</div>
    </div>
    <script>
        const c=document.getElementById('cv'),x=c.getContext('2d'),cb=document.getElementById('cubo'),au=document.getElementById('au'),pb=document.getElementById('pb'),pb2=document.getElementById('pb2'),pa=document.getElementById('pa'),ct=document.getElementById('ct'),dt=document.getElementById('dt'),vm=document.getElementById('vm'),vmz=document.getElementById('vmz'),vd=document.getElementById('vd'),vu=document.getElementById('vu'),vs=document.getElementById('vs'),vl=document.getElementById('vl'),st=document.getElementById('st'),er=document.getElementById('er'),ld=document.getElementById('ld');
        let ps=[],id=false,rx=-15,ry=15,lx,ly,vx=0,loaded=false,playing=false;
        function rs(){c.width=window.innerWidth;c.height=window.innerHeight}window.addEventListener('resize',rs);rs();
        class P{constructor(){this.i();this.y=Math.random()*c.height}i(){this.x=Math.random()*c.width;this.y=c.height+50;this.s=Math.random()*15+10;this.v=Math.random()*1.5+0.5;this.t=Math.random()>0.5?'❤️':'🌸';this.o=Math.random()*0.5+0.1}d(){this.x+=vx*0.4;this.y-=this.v;if(this.y<-50||this.x<-50||this.x>c.width+50)this.i();x.globalAlpha=this.o;x.font=this.s+"px serif";x.fillText(this.t,this.x,this.y)}}for(let i=0;i<100;i++)ps.push(new P());
        function fmt(s){const m=Math.floor(s/60),se=Math.floor(s%60);return m+":"+(se<10?'0'+se:se)}
        function an(){
            x.clearRect(0,0,c.width,c.height);ps.forEach(p=>p.d());
            if(!id){ry+=0.2;vx*=0.95} cb.style.transform="rotateX("+rx+"deg) rotateY("+ry+"deg)";
            if(!au.paused){pb2.style.width=(au.currentTime/au.duration)*100+"%";ct.innerText=fmt(au.currentTime)}
            requestAnimationFrame(an)
        }
        function loadAudio(){
            er.style.display='none';ld.style.display='block';loaded=false;
            au.pause();pb.innerHTML="▶";pb.classList.remove('pg');vm.classList.remove('sp');vmz.classList.remove('pg');playing=false;
            au.load();
            au.onloadedmetadata=function(){dt.innerText=fmt(au.duration);loaded=true;ld.style.display='none';er.style.display='none';setTimeout(()=>{if(!playing)tgl();},500)};
            au.onerror=function(){ld.style.display='none';er.style.display='block'};
        }
        function tgl(){if(!loaded){loadAudio();return}if(au.paused){au.play();pb.innerHTML="⏸";pb.classList.add('pg');vm.classList.add('sp');vmz.classList.add('pg');playing=true}else{au.pause();pb.innerHTML="▶";pb.classList.remove('pg');vm.classList.remove('sp');vmz.classList.remove('pg');playing=false}}
        pb.addEventListener('click',tgl);
        pa.addEventListener('click',(e)=>{const r=pa.getBoundingClientRect(),d=au.duration;if(d)au.currentTime=((e.clientX-r.left)/r.width)*d});
        au.addEventListener('ended',()=>{pb.innerHTML="▶";pb.classList.remove('pg');vm.classList.remove('sp');vmz.classList.remove('pg');playing=false});
        function updVol(v){au.volume=v/100;vl.textContent=Math.round(v)+'%'}
        vs.addEventListener('input',function(){updVol(this.value)});
        vd.addEventListener('click',()=>{let v=parseInt(vs.value)-10;if(v<0)v=0;vs.value=v;updVol(v)});
        vu.addEventListener('click',()=>{let v=parseInt(vs.value)+10;if(v>100)v=100;vs.value=v;updVol(v)});
        const stt=(e)=>{id=true;lx=e.pageX||e.touches[0].pageX;ly=e.pageY||e.touches[0].pageY};const en=()=>{id=false};const mv=(e)=>{if(!id)return;let nx=e.pageX||e.touches[0].pageX,ny=e.pageY||e.touches[0].pageY;vx=nx-lx;ry+=vx*0.5;rx-=(ny-ly)*0.5;lx=nx;ly=ny};
        window.addEventListener('mousedown',stt);window.addEventListener('touchstart',stt);window.addEventListener('mousemove',mv);window.addEventListener('touchmove',mv);window.addEventListener('mouseup',en);window.addEventListener('touchend',en);
        loadAudio();an();
    <\/script>
</body>
</html>`;
            const blob = new Blob([template], { type: 'text/html' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "Cubo de Amor 💖.html";
            link.click();
        });
    </script>
</body>
</html>
