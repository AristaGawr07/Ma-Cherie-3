<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>25 Mois - Notre Voyage</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', 'Corbel', 'Arial', sans-serif;
  }
  
  /* Panel flotante para el título y el reproductor */
  .ui-panel {
    position: fixed;
    top: 20px;
    left: 0;
    width: 100%;
    text-align: center;
    pointer-events: none;
    z-index: 20;
    text-shadow: 0 0 15px rgba(0,0,0,0.5);
  }
  
  .title-25 {
    font-size: clamp(1.6rem, 6vw, 3rem);
    font-weight: 300;
    letter-spacing: 6px;
    color: #ffe6cc;
    background: linear-gradient(135deg, #ffd6a5, #f5b7a8);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(255, 180, 100, 0.4);
    margin-bottom: 8px;
  }
  
  .sub {
    font-size: clamp(0.7rem, 3vw, 0.9rem);
    color: #ffccaa;
    letter-spacing: 2px;
    opacity: 0.8;
  }
  
  /* Reproductor de música con control de volumen */
  .music-controls {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 15, 30, 0.85);
    backdrop-filter: blur(16px);
    border-radius: 60px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid rgba(255, 210, 160, 0.4);
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    z-index: 100;
    font-family: monospace;
    pointer-events: auto;
  }
  
  .play-pause {
    background: linear-gradient(135deg, #f5a97f, #e07a5f);
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: white;
    font-size: 18px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 12px rgba(240, 100, 70, 0.6);
  }
  
  .play-pause:hover {
    transform: scale(1.05);
    background: linear-gradient(135deg, #f7b787, #e8876a);
  }
  
  .progress-bar-bg {
    flex: 1;
    width: 180px;
    max-width: 260px;
    height: 4px;
    background: rgba(255,255,240,0.25);
    border-radius: 4px;
    cursor: pointer;
  }
  
  .progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #ffb48a, #ff8c6b);
    border-radius: 4px;
  }
  
  .time-text {
    font-size: 11px;
    color: #ffddbb;
    min-width: 80px;
    text-align: right;
    letter-spacing: 1px;
  }
  
  /* Control de volumen */
  .volume-control {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.4);
    padding: 4px 12px;
    border-radius: 40px;
    margin-left: 5px;
  }
  
  .volume-icon {
    color: #ffccaa;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
  }
  
  .volume-slider {
    width: 70px;
    height: 3px;
    -webkit-appearance: none;
    background: rgba(255,255,240,0.3);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ffb48a;
    cursor: pointer;
    box-shadow: 0 0 5px #ffaa77;
  }
  
  @media (max-width: 650px) {
    .volume-control { padding: 2px 8px; }
    .volume-slider { width: 50px; }
    .progress-bar-bg { width: 120px; }
    .time-text { font-size: 9px; min-width: 70px; }
    .play-pause { width: 38px; height: 38px; font-size: 16px; }
    .music-controls { padding: 6px 14px; gap: 10px; }
  }
  
  @media (max-width: 500px) {
    .volume-slider { width: 40px; }
    .volume-icon { font-size: 11px; }
    .volume-control { gap: 4px; }
  }
  
  .rotate-hint {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    padding: 4px 12px;
    border-radius: 40px;
    font-size: 11px;
    color: #ffd4aa;
    letter-spacing: 1px;
    font-family: monospace;
    pointer-events: none;
    z-index: 99;
    white-space: nowrap;
  }
  
  @media (max-width: 500px) {
    .rotate-hint { bottom: 80px; font-size: 9px; }
  }
</style>
</head>
<body>
<div class="ui-panel">
  <div class="title-25">25 MOIS • NOTRE HISTOIRE</div>
  <div class="sub">L'AMOUR N'A PAS DE FRONTIÈRES</div>
</div>
<div class="music-controls">
  <button class="play-pause" id="playBtn">▶</button>
  <div class="progress-bar-bg" id="progressContainer">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="time-text" id="timeDisplay">0:00 / 0:00</div>
  <div class="volume-control">
    <span class="volume-icon" id="volumeIcon">🔊</span>
    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
  </div>
</div>
<div class="rotate-hint">〰️ Fais glisser pour tourner le message 〰️</div>

<audio id="bgAudio" loop preload="auto">
  <source src="https://files.catbox.moe/pgafel.mp3" type="audio/mpeg">
</audio>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  
  // --- Escena espacial romántica ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050518);
  scene.fog = new THREE.FogExp2(0x050518, 0.002);
  
  const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0.5, 5.2);
  camera.lookAt(0, 0, 0);
  
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.toneMapping = THREE.ReinhardToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);
  
  // --- Efecto Bloom (brillo suave) ---
  const renderScene = new RenderPass(scene, camera);
  const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.3, 0.7);
  bloomPass.threshold = 0.2;
  bloomPass.strength = 0.45;
  bloomPass.radius = 0.4;
  const effectComposer = new EffectComposer(renderer);
  effectComposer.addPass(renderScene);
  effectComposer.addPass(bloomPass);
  
  // --- Control interactivo (rotación y zoom) ---
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.rotateSpeed = 1.2;
  controls.zoomSpeed = 1.0;
  controls.enableZoom = true;
  controls.zoomSpeed = 0.8;
  controls.enablePan = false;
  controls.autoRotate = false;
  controls.target.set(0, 0, 0);
  controls.maxDistance = 7.8;
  controls.minDistance = 2.8;
  
  // --- Fondo de estrellas ---
  const starCount = 3200;
  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(starCount * 3);
  const starCol = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    starPos[i*3] = (Math.random() - 0.5) * 400;
    starPos[i*3+1] = (Math.random() - 0.5) * 240;
    starPos[i*3+2] = (Math.random() - 0.5) * 180 - 70;
    const warm = Math.random() > 0.7;
    if (warm) {
      starCol[i*3] = 1.0;
      starCol[i*3+1] = 0.7;
      starCol[i*3+2] = 0.5;
    } else {
      starCol[i*3] = 0.9;
      starCol[i*3+1] = 0.9;
      starCol[i*3+2] = 1.0;
    }
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
  const starMat = new THREE.PointsMaterial({ size: 0.13, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);
  
  // --- Partículas doradas alrededor ---
  const glowCount = 1200;
  const glowGeo = new THREE.BufferGeometry();
  const glowPositions = new Float32Array(glowCount * 3);
  for (let i = 0; i < glowCount; i++) {
    glowPositions[i*3] = (Math.random() - 0.5) * 20;
    glowPositions[i*3+1] = (Math.random() - 0.5) * 14;
    glowPositions[i*3+2] = (Math.random() - 0.5) * 16 - 4;
  }
  glowGeo.setAttribute('position', new THREE.BufferAttribute(glowPositions, 3));
  const glowMat = new THREE.PointsMaterial({ color: 0xffaa77, size: 0.035, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
  const glowParticles = new THREE.Points(glowGeo, glowMat);
  scene.add(glowParticles);
  
  // --- Mensaje Central con dos caras ---
  const messageGroup = new THREE.Group();
  
  // ========== LADO A (FRANCÉS/ITALIANO - ROMÁNTICO) ==========
  const sideAText = `✦ 25 MOIS ✦\n\nMON AMOUR, MA CHÉRIE\nDEPUIS 25 LUNES\nTU FAIS BRILLER MES JOURS\n\nCHAQUE INSTANT AVEC TOI\nEST UNE ÉTOILE DANS MON CIEL\n\nJE T'AIME PLUS CHAQUE JOUR\n♡ MON TRÉSOR ♡`;
  
  // ========== LADO B (ITALIANO/FRANCÉS - APASIONADO) ==========
  const sideBText = `✦ PER SEMPRE ✦\n\nAMORE MIO, TESORO MIO\n25 MESI DI MAGIA\nINSIEME ABBIAMO\nDIPINTO L'INFINITO\n\nLA TUA MANO NELLA MIA\nÈ LA MIA CASA\n\nJE T'AIME MON AMOUR\n❤️ AMORE MIO ❤️`;
  
  // Crear canvas para Lado A
  const canvasA = document.createElement('canvas');
  canvasA.width = 1024;
  canvasA.height = 1024;
  const ctxA = canvasA.getContext('2d');
  const gradA = ctxA.createLinearGradient(0, 0, canvasA.width, canvasA.height);
  gradA.addColorStop(0, '#2a1a35');
  gradA.addColorStop(0.5, '#1e1228');
  gradA.addColorStop(1, '#100b18');
  ctxA.fillStyle = gradA;
  ctxA.fillRect(0, 0, canvasA.width, canvasA.height);
  ctxA.strokeStyle = '#ffc49b';
  ctxA.lineWidth = 10;
  ctxA.strokeRect(35, 35, canvasA.width - 70, canvasA.height - 70);
  
  const linesA = sideAText.split('\n');
  let startYA = canvasA.height / 2 - (linesA.length * 42) / 2;
  linesA.forEach((line, idx) => {
    ctxA.fillStyle = idx === 0 ? '#ffcf9a' : '#ffe3ca';
    ctxA.font = idx === 0 ? `58px "Segoe UI", "Corbel", sans-serif` : `36px "Segoe UI", "Corbel", sans-serif`;
    ctxA.textAlign = 'center';
    ctxA.textBaseline = 'middle';
    ctxA.fillText(line, canvasA.width/2, startYA + idx * 52);
  });
  ctxA.font = `32px "Segoe UI"`;
  ctxA.fillStyle = '#ff8899';
  ctxA.fillText("✨", canvasA.width/2 - 80, canvasA.height - 60);
  ctxA.fillText("✨", canvasA.width/2 + 80, canvasA.height - 60);
  const textureA = new THREE.CanvasTexture(canvasA);
  
  // Crear canvas para Lado B
  const canvasB = document.createElement('canvas');
  canvasB.width = 1024;
  canvasB.height = 1024;
  const ctxB = canvasB.getContext('2d');
  const gradB = ctxB.createLinearGradient(0, 0, canvasB.width, canvasB.height);
  gradB.addColorStop(0, '#1f2a3a');
  gradB.addColorStop(0.5, '#121a27');
  gradB.addColorStop(1, '#0a0f18');
  ctxB.fillStyle = gradB;
  ctxB.fillRect(0, 0, canvasB.width, canvasB.height);
  ctxB.strokeStyle = '#aac9ff';
  ctxB.lineWidth = 10;
  ctxB.strokeRect(35, 35, canvasB.width - 70, canvasB.height - 70);
  
  const linesB = sideBText.split('\n');
  let startYB = canvasB.height / 2 - (linesB.length * 42) / 2;
  linesB.forEach((line, idx) => {
    ctxB.fillStyle = idx === 0 ? '#ffcf9a' : '#cbe4fe';
    ctxB.font = idx === 0 ? `58px "Segoe UI", "Corbel", sans-serif` : `36px "Segoe UI", "Corbel", sans-serif`;
    ctxB.textAlign = 'center';
    ctxB.textBaseline = 'middle';
    ctxB.fillText(line, canvasB.width/2, startYB + idx * 52);
  });
  ctxB.font = `32px "Segoe UI"`;
  ctxB.fillStyle = '#ff8899';
  ctxB.fillText("❤️", canvasB.width/2 - 80, canvasB.height - 60);
  ctxB.fillText("❤️", canvasB.width/2 + 80, canvasB.height - 60);
  const textureB = new THREE.CanvasTexture(canvasB);
  
  // Crear el cubo con las texturas
  const geometry = new THREE.BoxGeometry(2.9, 2.9, 0.18);
  const materials = [
    new THREE.MeshStandardMaterial({ map: textureB, roughness: 0.25, metalness: 0.1, emissive: '#221c2a', emissiveIntensity: 0.15 }),
    new THREE.MeshStandardMaterial({ map: textureA, roughness: 0.25, metalness: 0.1, emissive: '#1e1726', emissiveIntensity: 0.15 }),
    new THREE.MeshStandardMaterial({ color: 0x331e2c, roughness: 0.6 }),
    new THREE.MeshStandardMaterial({ color: 0x331e2c, roughness: 0.6 }),
    new THREE.MeshStandardMaterial({ color: 0x4a2a3a, roughness: 0.5 }),
    new THREE.MeshStandardMaterial({ color: 0x4a2a3a, roughness: 0.5 })
  ];
  const messageBox = new THREE.Mesh(geometry, materials);
  messageBox.castShadow = true;
  messageGroup.add(messageBox);
  
  // Anillo de partículas alrededor del mensaje
  const haloCount = 400;
  const haloGeo = new THREE.BufferGeometry();
  const haloPos = new Float32Array(haloCount * 3);
  for (let i = 0; i < haloCount; i++) {
    const rad = 2.0 + Math.random() * 0.6;
    const ang = Math.random() * Math.PI * 2;
    const yoff = (Math.random() - 0.5) * 1.6;
    haloPos[i*3] = Math.cos(ang) * rad;
    haloPos[i*3+1] = yoff;
    haloPos[i*3+2] = Math.sin(ang) * rad;
  }
  haloGeo.setAttribute('position', new THREE.BufferAttribute(haloPos, 3));
  const haloMat = new THREE.PointsMaterial({ color: 0xffb88a, size: 0.025, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending });
  const haloPoints = new THREE.Points(haloGeo, haloMat);
  messageGroup.add(haloPoints);
  
  scene.add(messageGroup);
  
  // --- Estrellitas orbitando ---
  const orbCount = 250;
  const orbPositions = new Float32Array(orbCount * 3);
  for (let i = 0; i < orbCount; i++) {
    const r = 1.9 + Math.random() * 0.8;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI * 2;
    orbPositions[i*3] = Math.sin(theta) * Math.cos(phi) * r;
    orbPositions[i*3+1] = Math.sin(theta) * Math.sin(phi) * r * 0.6;
    orbPositions[i*3+2] = Math.cos(theta) * r;
  }
  const orbBufferGeo = new THREE.BufferGeometry();
  orbBufferGeo.setAttribute('position', new THREE.BufferAttribute(orbPositions, 3));
  const orbMatStars = new THREE.PointsMaterial({ color: 0xffc89c, size: 0.03, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
  const orbitingStarsObj = new THREE.Points(orbBufferGeo, orbMatStars);
  scene.add(orbitingStarsObj);
  
  const originalOrbPos = orbPositions.slice();
  
  // --- Animación ---
  let time = 0;
  
  function animateScene() {
    requestAnimationFrame(animateScene);
    time += 0.012;
    
    messageGroup.rotation.y = Math.sin(time * 0.2) * 0.1;
    messageGroup.rotation.x = Math.sin(time * 0.25) * 0.05;
    
    const positions = orbitingStarsObj.geometry.attributes.position.array;
    for (let i = 0; i < orbCount; i++) {
      const origX = originalOrbPos[i*3];
      const origZ = originalOrbPos[i*3+2];
      const angle = time * 0.8;
      const newX = origX * Math.cos(angle) + origZ * Math.sin(angle);
      const newZ = -origX * Math.sin(angle) + origZ * Math.cos(angle);
      positions[i*3] = newX;
      positions[i*3+2] = newZ;
    }
    orbitingStarsObj.geometry.attributes.position.needsUpdate = true;
    
    stars.rotation.y += 0.0003;
    stars.rotation.x += 0.0002;
    glowParticles.rotation.y += 0.0005;
    
    effectComposer.render();
  }
  
  animateScene();
  
  // --- Control de música ---
  const audioEl = document.getElementById('bgAudio');
  const playBtn = document.getElementById('playBtn');
  const progressFill = document.getElementById('progressFill');
  const progressContainer = document.getElementById('progressContainer');
  const timeSpan = document.getElementById('timeDisplay');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeIcon = document.getElementById('volumeIcon');
  
  audioEl.volume = 0.7;
  volumeSlider.value = 0.7;
  
  function updateButtonUI() {
    playBtn.textContent = audioEl.paused ? '▶' : '⏸';
  }
  
  playBtn.addEventListener('click', () => {
    if (audioEl.paused) {
      audioEl.play();
    } else {
      audioEl.pause();
    }
    updateButtonUI();
  });
  
  audioEl.addEventListener('timeupdate', () => {
    if (audioEl.duration) {
      const percent = (audioEl.currentTime / audioEl.duration) * 100;
      progressFill.style.width = percent + '%';
      const curM = Math.floor(audioEl.currentTime / 60);
      const curS = Math.floor(audioEl.currentTime % 60);
      const durM = Math.floor(audioEl.duration / 60);
      const durS = Math.floor(audioEl.duration % 60);
      timeSpan.textContent = `${curM}:${curS.toString().padStart(2,'0')} / ${durM}:${durS.toString().padStart(2,'0')}`;
    }
  });
  
  progressContainer.addEventListener('click', (e) => {
    if (audioEl.duration) {
      const rect = progressContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const percent = x / rect.width;
      audioEl.currentTime = percent * audioEl.duration;
    }
  });
  
  volumeSlider.addEventListener('input', (e) => {
    const vol = parseFloat(e.target.value);
    audioEl.volume = vol;
    volumeIcon.textContent = vol === 0 ? '🔇' : (vol < 0.3 ? '🔈' : '🔊');
  });
  
  volumeIcon.addEventListener('click', () => {
    if (audioEl.volume > 0) {
      audioEl.volume = 0;
      volumeSlider.value = 0;
      volumeIcon.textContent = '🔇';
    } else {
      audioEl.volume = 0.7;
      volumeSlider.value = 0.7;
      volumeIcon.textContent = '🔊';
    }
  });
  
  audioEl.addEventListener('ended', updateButtonUI);
  audioEl.addEventListener('play', updateButtonUI);
  audioEl.addEventListener('pause', updateButtonUI);
  
  audioEl.pause();
  updateButtonUI();
  
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    effectComposer.setSize(window.innerWidth, window.innerHeight);
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
