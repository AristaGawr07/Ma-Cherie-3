<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>✦ Saturno de Amor ✦ | Nuestro Viaje Estelar ✨</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #010103;
    overflow: hidden;
    font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  /* --- Reproductor Musical Adaptable y Romántico --- */
  .player {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    max-width: 480px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 20px;
    background: rgba(15, 10, 30, 0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 182, 193, 0.5);
    border-radius: 60px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 15px rgba(255, 105, 180, 0.3);
    z-index: 1000;
    color: #ffe0e7;
    transition: all 0.3s ease;
    font-weight: 500;
  }
  
  .player button {
    background: linear-gradient(135deg, #ffb6c1, #ff69b4);
    border: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    width: 44px;
    height: 44px;
    min-width: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    box-shadow: 0 4px 12px rgba(255, 105, 180, 0.5);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .player button:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 18px rgba(255, 105, 180, 0.7);
  }

  .progress {
    flex-grow: 1;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 5px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: inset 0 0 2px rgba(0,0,0,0.2);
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffb6c1, #ff69b4);
    box-shadow: 0 0 10px #ff69b4;
    border-radius: 5px;
  }
  .time {
    font-size: 11px;
    min-width: 70px;
    text-align: right;
    opacity: 0.9;
    letter-spacing: 0.5px;
    font-family: monospace;
  }

  /* --- Etiqueta informativa con estilo soñador --- */
  .info {
    position: fixed;
    top: 20px;
    width: 100%;
    text-align: center;
    color: rgba(255, 220, 230, 0.9);
    font-size: 12px;
    pointer-events: none;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 400;
    text-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
    background: linear-gradient(135deg, #ffdde1, #ffb6c1);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    animation: gentleGlow 3s infinite alternate;
  }

  @keyframes gentleGlow {
    0% { opacity: 0.6; text-shadow: 0 0 5px #ff69b4; }
    100% { opacity: 1; text-shadow: 0 0 20px #ffb6c1; }
  }

  @media (max-width: 600px) {
    .player { padding: 8px 15px; width: 90%; gap: 10px; }
    .info { font-size: 8px; letter-spacing: 2px; top: 12px; }
    .player button { width: 38px; height: 38px; font-size: 18px; }
  }
</style>
</head>
<body>

<div class="player">
  <button id="play">💗</button>
  <div class="progress" id="progress"><div class="progress-bar" id="progress-bar"></div></div>
  <div class="time" id="time">0:00 / 0:00</div>
</div>

<!-- NUEVA CANCIÓN: URL ROMÁNTICA REEMPLAZADA -->
<audio id="audio" loop>
  <source src="https://files.catbox.moe/pgafel.mp3" type="audio/mpeg">
</audio>

<script>
  // --- JavaScript para la animación de estrellas y el reproductor ---
  (function() {
    // ======================= ANIMACIÓN DE PARTÍCULAS (Fondo Estelar Romántico) =======================
    const canvas = document.createElement('canvas');
    canvas.style.position = 'fixed';
    canvas.style.top = '0';
    canvas.style.left = '0';
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    canvas.style.zIndex = '0';
    canvas.style.display = 'block';
    document.body.appendChild(canvas);
    
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    const PARTICLE_COUNT = 280;
    const COLORS = ['#ffffff', '#ffe0f0', '#ffb6c1', '#ff9eb5', '#ffd9e6', '#ffc0cb', '#ffe4f0'];

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2.5 + 1;
        this.speedX = (Math.random() - 0.5) * 0.25;
        this.speedY = (Math.random() - 0.5) * 0.2 + (Math.random() * 0.3);
        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.alpha = Math.random() * 0.6 + 0.3;
        this.twinkle = Math.random() * Math.PI * 2;
      }
      
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.twinkle += 0.02;
        if (this.y > height + 20) this.y = -20;
        if (this.x > width + 20) this.x = -20;
        if (this.x < -20) this.x = width + 20;
        if (this.y < -20) this.y = height + 20;
      }
      
      draw() {
        ctx.save();
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.alpha + Math.sin(this.twinkle) * 0.15;
        ctx.fill();
        ctx.restore();
      }
    }
    
    function initParticles() {
      particles = [];
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Particle());
      }
    }
    
    function animateParticles() {
      ctx.clearRect(0, 0, width, height);
      // Fondo con degradado suave y romántico
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#03001c');
      grad.addColorStop(0.5, '#1a0b2e');
      grad.addColorStop(1, '#2d123b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
      
      for (let p of particles) {
        p.update();
        p.draw();
      }
      requestAnimationFrame(animateParticles);
    }
    
    window.addEventListener('resize', () => {
      resizeCanvas();
      initParticles();
    });
    
    resizeCanvas();
    initParticles();
    animateParticles();
    
    // ======================= REPRODUCTOR DE MÚSICA =======================
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress');
    const timeDisplay = document.getElementById('time');
    
    let isPlaying = false;
    
    function updateProgress() {
      if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = percent + '%';
        const currentMins = Math.floor(audio.currentTime / 60);
        const currentSecs = Math.floor(audio.currentTime % 60);
        const durMins = Math.floor(audio.duration / 60);
        const durSecs = Math.floor(audio.duration % 60);
        timeDisplay.textContent = `${currentMins}:${currentSecs.toString().padStart(2,'0')} / ${durMins}:${durSecs.toString().padStart(2,'0')}`;
      }
    }
    
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('loadedmetadata', updateProgress);
    
    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        audio.pause();
        playBtn.textContent = '💖';
      } else {
        audio.play().catch(e => console.log("Auto-play bloqueado, necesita interacción."));
        playBtn.textContent = '✨';
      }
      isPlaying = !isPlaying;
    });
    
    audio.addEventListener('play', () => {
      isPlaying = true;
      playBtn.textContent = '✨';
    });
    audio.addEventListener('pause', () => {
      isPlaying = false;
      playBtn.textContent = '💖';
    });
    
    progressContainer.addEventListener('click', (e) => {
      const rect = progressContainer.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const percent = clickX / rect.width;
      if (audio.duration) {
        audio.currentTime = percent * audio.duration;
      }
    });
    
    // Añadir un pequeño efecto hover en el reproductor
    const playerDiv = document.querySelector('.player');
    playerDiv.addEventListener('mouseenter', () => {
      playerDiv.style.borderColor = 'rgba(255, 200, 210, 0.8)';
      playerDiv.style.boxShadow = '0 0 25px rgba(255, 105, 180, 0.5)';
    });
    playerDiv.addEventListener('mouseleave', () => {
      playerDiv.style.borderColor = 'rgba(255, 182, 193, 0.3)';
      playerDiv.style.boxShadow = '0 10px 30px rgba(0, 0, 0, 0.5)';
    });
  })();
</script>
<!-- Mensaje flotante (se reemplaza con texto en canvas pero lo dejamos como etiqueta decorativa) -->
<div class="info">💗  M O N   C Œ U R   T ' A P P A R T I E N T   💗  |  C A R A   M I A   ✨  |  A M O R E   M I O   💕</div>
</body>
</html>
