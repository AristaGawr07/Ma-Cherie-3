<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>25 Meses - Nuestro Amor</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', 'Corbel', 'Arial', sans-serif;
  }
  
  .ui-panel {
    position: fixed;
    top: 20px;
    left: 0;
    width: 100%;
    text-align: center;
    pointer-events: none;
    z-index: 20;
    text-shadow: 0 0 15px rgba(0,0,0,0.5);
  }
  
  .title-25 {
    font-size: clamp(1.4rem, 5vw, 2.8rem);
    font-weight: 300;
    letter-spacing: 6px;
    background: linear-gradient(135deg, #ffd6a5, #f5b7a8, #ffd6a5);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(255, 180, 100, 0.5);
    margin-bottom: 8px;
  }
  
  .sub {
    font-size: clamp(0.65rem, 2.5vw, 0.85rem);
    color: #ffccaa;
    letter-spacing: 3px;
    opacity: 0.9;
    text-transform: uppercase;
  }
  
  .music-controls {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 15, 30, 0.85);
    backdrop-filter: blur(16px);
    border-radius: 60px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid rgba(255, 210, 160, 0.4);
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    z-index: 100;
    font-family: monospace;
    pointer-events: auto;
  }
  
  .play-pause {
    background: linear-gradient(135deg, #f5a97f, #e07a5f);
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: white;
    font-size: 18px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 12px rgba(240, 100, 70, 0.6);
  }
  
  .play-pause:hover {
    transform: scale(1.05);
    background: linear-gradient(135deg, #f7b787, #e8876a);
  }
  
  .progress-bar-bg {
    flex: 1;
    width: 180px;
    max-width: 260px;
    height: 4px;
    background: rgba(255,255,240,0.25);
    border-radius: 4px;
    cursor: pointer;
  }
  
  .progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #ffb48a, #ff8c6b);
    border-radius: 4px;
  }
  
  .time-text {
    font-size: 11px;
    color: #ffddbb;
    min-width: 80px;
    text-align: right;
    letter-spacing: 1px;
  }
  
  .volume-control {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.4);
    padding: 4px 12px;
    border-radius: 40px;
    margin-left: 5px;
  }
  
  .volume-icon {
    color: #ffccaa;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
  }
  
  .volume-slider {
    width: 70px;
    height: 3px;
    -webkit-appearance: none;
    background: rgba(255,255,240,0.3);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ffb48a;
    cursor: pointer;
    box-shadow: 0 0 5px #ffaa77;
  }
  
  @media (max-width: 650px) {
    .volume-control { padding: 2px 8px; }
    .volume-slider { width: 50px; }
    .progress-bar-bg { width: 120px; }
    .time-text { font-size: 9px; min-width: 70px; }
    .play-pause { width: 38px; height: 38px; font-size: 16px; }
    .music-controls { padding: 6px 14px; gap: 10px; }
  }
  
  @media (max-width: 500px) {
    .volume-slider { width: 40px; }
    .volume-icon { font-size: 11px; }
    .volume-control { gap: 4px; }
  }
  
  .rotate-hint {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    padding: 5px 16px;
    border-radius: 40px;
    font-size: 11px;
    color: #ffd4aa;
    letter-spacing: 2px;
    font-family: monospace;
    pointer-events: none;
    z-index: 99;
    white-space: nowrap;
    border: 1px solid rgba(255,200,150,0.3);
  }
  
  @media (max-width: 500px) {
    .rotate-hint { bottom: 80px; font-size: 9px; white-space: nowrap; }
  }
</style>
</head>
<body>
<div class="ui-panel">
  <div class="title-25">✦ 25 MESES • NUESTRO AMOR ✦</div>
  <div class="sub">CADA DÍA CONTIGO ES UNA ESTRELLA EN MI CIELO</div>
</div>
<div class="music-controls">
  <button class="play-pause" id="playBtn">▶</button>
  <div class="progress-bar-bg" id="progressContainer">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="time-text" id="timeDisplay">0:00 / 0:00</div>
  <div class="volume-control">
    <span class="volume-icon" id="volumeIcon">🔊</span>
    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
  </div>
</div>
<div class="rotate-hint">〰️ GIRA EL MENSAJE CON EL RATÓN 〰️</div>

<audio id="bgAudio" loop preload="auto">
  <source src="https://files.catbox.moe/pgafel.mp3" type="audio/mpeg">
</audio>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  
  // --- Escena espacial romántica ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030318);
  scene.fog = new THREE.FogExp2(0x030318, 0.0015);
  
  const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0.3, 5.8);
  camera.lookAt(0, 0, 0);
  
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);
  
  // --- Efecto Bloom (brillo mágico) ---
  const renderScene = new RenderPass(scene, camera);
  const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.4, 0.85);
  bloomPass.threshold = 0.15;
  bloomPass.strength = 0.55;
  bloomPass.radius = 0.5;
  const effectComposer = new EffectComposer(renderer);
  effectComposer.addPass(renderScene);
  effectComposer.addPass(bloomPass);
  
  // --- Control interactivo ---
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.rotateSpeed = 1.0;
  controls.zoomSpeed = 1.0;
  controls.enableZoom = true;
  controls.enablePan = false;
  controls.autoRotate = false;
  controls.target.set(0, 0, 0);
  controls.maxDistance = 8.5;
  controls.minDistance = 2.8;
  
  // ========== ANIMACIONES DE CALIDAD ==========
  
  // --- 1. Campo de estrellas profundo ---
  const starCount = 4000;
  const starGeo = new THREE.BufferGeometry();
  const starPositions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    starPositions[i*3] = (Math.random() - 0.5) * 500;
    starPositions[i*3+1] = (Math.random() - 0.5) * 300;
    starPositions[i*3+2] = (Math.random() - 0.5) * 250 - 100;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);
  
  // --- 2. Estrellas fugaces ---
  const shootingStars = [];
  const shootingStarCount = 8;
  const trailLines = [];
  for (let i = 0; i < shootingStarCount; i++) {
    const material = new THREE.LineBasicMaterial({ color: 0xffaa77 });
    const geometry = new THREE.BufferGeometry();
    const line = new THREE.Line(geometry, material);
    scene.add(line);
    trailLines.push(line);
    shootingStars.push({ active: false, progress: 0, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, trail: [] });
  }
  
  function spawnShootingStar() {
    for (let star of shootingStars) {
      if (!star.active && Math.random() < 0.003) {
        star.active = true;
        star.progress = 0;
        star.x = (Math.random() - 0.5) * 30;
        star.y = (Math.random() - 0.5) * 20 + 5;
        star.z = (Math.random() - 0.5) * 40 - 20;
        star.vx = (Math.random() - 0.5) * 0.8 - 0.5;
        star.vy = (Math.random() - 0.5) * 0.6 - 0.3;
        star.vz = (Math.random() - 0.5) * 0.7 + 0.5;
        star.trail = [];
        break;
      }
    }
  }
  
  // --- 3. Polvo estelar brillante ---
  const dustCount = 2500;
  const dustGeo = new THREE.BufferGeometry();
  const dustPositions = new Float32Array(dustCount * 3);
  const dustColors = new Float32Array(dustCount * 3);
  for (let i = 0; i < dustCount; i++) {
    dustPositions[i*3] = (Math.random() - 0.5) * 28;
    dustPositions[i*3+1] = (Math.random() - 0.5) * 18;
    dustPositions[i*3+2] = (Math.random() - 0.5) * 22 - 8;
    const colorWarm = Math.random() > 0.6;
    dustColors[i*3] = colorWarm ? 1.0 : 0.9;
    dustColors[i*3+1] = colorWarm ? 0.7 : 0.9;
    dustColors[i*3+2] = colorWarm ? 0.5 : 1.0;
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
  dustGeo.setAttribute('color', new THREE.BufferAttribute(dustColors, 3));
  const dustMat = new THREE.PointsMaterial({ size: 0.035, vertexColors: true, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending });
  const dustParticles = new THREE.Points(dustGeo, dustMat);
  scene.add(dustParticles);
  
  // --- 4. Anillo brillante giratorio ---
  const ringParticleCount = 400;
  const ringGeo = new THREE.BufferGeometry();
  const ringPositions = new Float32Array(ringParticleCount * 3);
  for (let i = 0; i < ringParticleCount; i++) {
    const angle = (i / ringParticleCount) * Math.PI * 2;
    const radius = 2.0;
    const yOffset = Math.sin(angle * 2) * 0.2;
    ringPositions[i*3] = Math.cos(angle) * radius;
    ringPositions[i*3+1] = yOffset;
    ringPositions[i*3+2] = Math.sin(angle) * radius;
  }
  ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
  const ringParticleMat = new THREE.PointsMaterial({ color: 0xffaa88, size: 0.032, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
  const ringParticlesObj = new THREE.Points(ringGeo, ringParticleMat);
  scene.add(ringParticlesObj);
  
  // ========== MENSAJE EN ESPAÑOL CON TÉRMINOS FRANCESES ==========
  const messageGroup = new THREE.Group();
  
  // Texto para la cara frontal (Español con Ma Chérie, Mon Amour)
  const textFront = `✦ 25 MESES ✦

MI AMOR, MA CHÉRIE

25 MESES A TU LADO
Y CADA DÍA SIGO ENAMORÁNDOME

TUS MANOS, TU RISA, TU MIRADA
SON MI LUGAR SEGURO, MI HOGAR

GRACIAS POR CADA INSTANTE
GRACIAS POR CADA SUEÑO

JE T'AIME, MA CHÉRIE

♡ ETERNAMENTE TUYA/O ♡`;
  
  // Texto para la cara trasera (Español con términos franceses/italianos)
  const textBack = `✦ PARA SIEMPRE ✦

AMORE MIO, MON TRÉSOR

25 MESES DE MAGIA
Y UNA VIDA ENTERA POR DELANTE

HE ENCONTRADO EN TI
LO QUE NUNCA BUSQUÉ

CADA DÍA A TU LADO
ES UN REGALO DEL CIELO

JE T'AIME, MON AMOUR

❤️ POR SIEMPRE JUNTOS ❤️`;
  
  function createElegantTexture(content, isFront) {
    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 1024;
    const ctx = canvas.getContext('2d');
    
    const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width/2);
    if (isFront) {
      grad.addColorStop(0, '#2a1a40');
      grad.addColorStop(0.5, '#1a1028');
      grad.addColorStop(1, '#0e0818');
    } else {
      grad.addColorStop(0, '#1a2540');
      grad.addColorStop(0.5, '#101528');
      grad.addColorStop(1, '#080c18');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Decoración de esquinas
    ctx.strokeStyle = isFront ? '#ffc49b' : '#aac9ff';
    ctx.lineWidth = 4;
    for (let i = 0; i < 4; i++) {
      const cornerX = i % 2 === 0 ? 40 : canvas.width - 40;
      const cornerY = i < 2 ? 40 : canvas.height - 40;
      ctx.beginPath();
      ctx.moveTo(cornerX, cornerY);
      ctx.lineTo(cornerX + (i % 2 === 0 ? 60 : -60), cornerY);
      ctx.moveTo(cornerX, cornerY);
      ctx.lineTo(cornerX, cornerY + (i < 2 ? 60 : -60));
      ctx.stroke();
    }
    
    // Borde decorativo
    ctx.strokeStyle = isFront ? '#ffc49b' : '#aac9ff';
    ctx.lineWidth = 6;
    ctx.strokeRect(35, 35, canvas.width - 70, canvas.height - 70);
    ctx.strokeStyle = '#ffffff30';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(45, 45, canvas.width - 90, canvas.height - 90);
    
    // Dibujar texto
    const lines = content.split('\n');
    const lineHeight = 70;
    const startY = canvas.height / 2 - (lines.length * lineHeight) / 2;
    
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    lines.forEach((line, idx) => {
      const yPos = startY + idx * lineHeight;
      
      if (line.includes('✦') || line.includes('❤️') || line.includes('♡')) {
        ctx.font = `58px "Segoe UI", "Corbel", "Arial", sans-serif`;
        ctx.fillStyle = '#ffcf9a';
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#ffaa77';
        ctx.fillText(line, canvas.width/2, yPos);
        ctx.shadowBlur = 0;
      }
      else if (line.includes('MA CHÉRIE') || line.includes('MON AMOUR') || line.includes('AMORE MIO') || line.includes('MON TRÉSOR')) {
        ctx.font = `48px "Segoe UI", "Corbel", "Arial", sans-serif`;
        ctx.fillStyle = '#ffaa88';
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#ff8866';
        ctx.fillText(line, canvas.width/2, yPos);
        ctx.shadowBlur = 0;
      }
      else if (line.includes('JE T')) {
        ctx.font = `46px "Segoe UI", "Corbel", "Arial", sans-serif`;
        ctx.fillStyle = '#ffbb99';
        ctx.fillText(line, canvas.width/2, yPos);
      }
      else if (line.trim() === '') {
        return;
      }
      else {
        ctx.font = `35px "Segoe UI", "Corbel", "Arial", sans-serif`;
        ctx.fillStyle = isFront ? '#ffe3ca' : '#cbe4fe';
        ctx.fillText(line, canvas.width/2, yPos);
        ctx.fillStyle = isFront ? '#d4b896' : '#a0b8d4';
        ctx.fillText(line, canvas.width/2 + 2, yPos + 2);
      }
    });
    
    // Decoraciones
    ctx.font = `36px "Segoe UI"`;
    ctx.fillStyle = '#ffaa88';
    ctx.fillText("✨", canvas.width/2 - 140, canvas.height - 65);
    ctx.fillText("✨", canvas.width/2 + 140, canvas.height - 65);
    ctx.fillStyle = '#ff88aa';
    ctx.fillText("⭐", canvas.width/2 - 150, 75);
    ctx.fillText("⭐", canvas.width/2 + 150, 75);
    
    const texture = new THREE.CanvasTexture(canvas);
    texture.needsUpdate = true;
    return texture;
  }
  
  const textureFront = createElegantTexture(textFront, true);
  const textureBack = createElegantTexture(textBack, false);
  
  // Crear tarjeta
  const cardGroup = new THREE.Group();
  
  const frontPlane = new THREE.PlaneGeometry(2.9, 2.9);
  const frontMat = new THREE.MeshStandardMaterial({ map: textureFront, side: THREE.DoubleSide, roughness: 0.25, metalness: 0.15, emissive: '#2a1a40', emissiveIntensity: 0.2, transparent: true });
  const frontCard = new THREE.Mesh(frontPlane, frontMat);
  frontCard.position.z = 0.06;
  cardGroup.add(frontCard);
  
  const backPlane = new THREE.PlaneGeometry(2.9, 2.9);
  const backMat = new THREE.MeshStandardMaterial({ map: textureBack, side: THREE.DoubleSide, roughness: 0.25, metalness: 0.15, emissive: '#1a2540', emissiveIntensity: 0.2, transparent: true });
  const backCard = new THREE.Mesh(backPlane, backMat);
  backCard.position.z = -0.06;
  backCard.rotation.y = Math.PI;
  cardGroup.add(backCard);
  
  // Marco dorado
  const frameGeo = new THREE.BoxGeometry(3.05, 3.05, 0.1);
  const frameMat = new THREE.MeshStandardMaterial({ color: 0xd49a6a, metalness: 0.7, roughness: 0.3, emissive: '#552200', emissiveIntensity: 0.15 });
  const frame = new THREE.Mesh(frameGeo, frameMat);
  cardGroup.add(frame);
  
  // Diamantes en esquinas
  const diamondMat = new THREE.MeshStandardMaterial({ color: 0xffaa77, metalness: 0.8, roughness: 0.2, emissive: '#ff8844', emissiveIntensity: 0.3 });
  const corners = [
    [-1.45, 1.45, 0.08], [1.45, 1.45, 0.08],
    [-1.45, -1.45, 0.08], [1.45, -1.45, 0.08]
  ];
  corners.forEach(pos => {
    const diamond = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), diamondMat);
    diamond.position.set(pos[0], pos[1], pos[2]);
    cardGroup.add(diamond);
  });
  
  scene.add(cardGroup);
  
  // --- Partículas orbitantes ---
  const orbCount = 150;
  const orbItems = [];
  for (let i = 0; i < orbCount; i++) {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(0,0,0,0)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = `${18 + Math.random() * 12}px "Segoe UI"`;
    ctx.fillStyle = `rgba(255, ${120 + Math.random() * 80}, ${100 + Math.random() * 80}, 0.8)`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const icons = ['❤️', '✨', '⭐', '💫', '🌟'];
    ctx.fillText(icons[Math.floor(Math.random() * icons.length)], canvas.width/2, canvas.height/2);
    const texture = new THREE.CanvasTexture(canvas);
    const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending });
    const sprite = new THREE.Sprite(mat);
    const radius = 2.2 + Math.random() * 0.8;
    const speed = 0.002 + Math.random() * 0.005;
    const angle = Math.random() * Math.PI * 2;
    const yOffset = (Math.random() - 0.5) * 1.4;
    sprite.userData = { radius, speed, angle, yOffset, baseScale: 0.18 + Math.random() * 0.1 };
    sprite.scale.set(sprite.userData.baseScale, sprite.userData.baseScale, 1);
    scene.add(sprite);
    orbItems.push(sprite);
  }
  
  // ========== ANIMACIÓN PRINCIPAL ==========
  let time = 0;
  
  function animate() {
    requestAnimationFrame(animate);
    time += 0.012;
    
    // Rotación suave de la tarjeta
    cardGroup.rotation.y = Math.sin(time * 0.12) * 0.08;
    cardGroup.rotation.x = Math.sin(time * 0.18) * 0.04;
    
    // Rotación del anillo
    ringParticlesObj.rotation.y = time * 0.3;
    ringParticlesObj.rotation.x = Math.sin(time * 0.5) * 0.2;
    
    // Movimiento de partículas
    dustParticles.rotation.y += 0.0005;
    dustParticles.rotation.x += 0.0003;
    stars.rotation.y += 0.0002;
    stars.rotation.x += 0.0001;
    
    // Estrellas fugaces
    spawnShootingStar();
    for (let i = 0; i < shootingStars.length; i++) {
      const star = shootingStars[i];
      if (star.active) {
        star.progress += 0.02;
        const t = star.progress;
        const currentX = star.x + star.vx * t * 15;
        const currentY = star.y + star.vy * t * 15;
        const currentZ = star.z + star.vz * t * 15;
        star.trail.unshift({ x: currentX, y: currentY, z: currentZ });
        if (star.trail.length > 20) star.trail.pop();
        const points = star.trail.map(p => new THREE.Vector3(p.x, p.y, p.z));
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        trailLines[i].geometry.dispose();
        trailLines[i].geometry = geometry;
        if (t >= 1 || Math.abs(currentX) > 25 || Math.abs(currentY) > 18 || Math.abs(currentZ) > 30) {
          star.active = false;
          trailLines[i].geometry.dispose();
          trailLines[i].geometry = new THREE.BufferGeometry();
        }
      }
    }
    
    // Actualizar elementos orbitantes
    orbItems.forEach(sprite => {
      const d = sprite.userData;
      d.angle += d.speed;
      const x = Math.cos(d.angle) * d.radius;
      const z = Math.sin(d.angle) * d.radius;
      sprite.position.set(x, d.yOffset, z);
      const scale = d.baseScale + Math.sin(time * 3) * 0.03;
      sprite.scale.set(scale, scale, 1);
      if (sprite.material.map) sprite.material.map.needsUpdate = true;
    });
    
    // Refrescar texturas
    if (Math.floor(time * 2) % 30 === 0) {
      textureFront.needsUpdate = true;
      textureBack.needsUpdate = true;
    }
    
    effectComposer.render();
  }
  
  animate();
  
  // ========== CONTROL DE MÚSICA ==========
  const audioEl = document.getElementById('bgAudio');
  const playBtn = document.getElementById('playBtn');
  const progressFill = document.getElementById('progressFill');
  const progressContainer = document.getElementById('progressContainer');
  const timeSpan = document.getElementById('timeDisplay');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeIcon = document.getElementById('volumeIcon');
  
  audioEl.volume = 0.7;
  volumeSlider.value = 0.7;
  
  function updateButtonUI() {
    playBtn.textContent = audioEl.paused ? '▶' : '⏸';
  }
  
  playBtn.addEventListener('click', () => {
    if (audioEl.paused) {
      audioEl.play().catch(e => console.log('Error:', e));
    } else {
      audioEl.pause();
    }
    updateButtonUI();
  });
  
  audioEl.addEventListener('timeupdate', () => {
    if (audioEl.duration) {
      const percent = (audioEl.currentTime / audioEl.duration) * 100;
      progressFill.style.width = percent + '%';
      const curM = Math.floor(audioEl.currentTime / 60);
      const curS = Math.floor(audioEl.currentTime % 60);
      const durM = Math.floor(audioEl.duration / 60);
      const durS = Math.floor(audioEl.duration % 60);
      timeSpan.textContent = `${curM}:${curS.toString().padStart(2,'0')} / ${durM}:${durS.toString().padStart(2,'0')}`;
    }
  });
  
  progressContainer.addEventListener('click', (e) => {
    if (audioEl.duration) {
      const rect = progressContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const percent = x / rect.width;
      audioEl.currentTime = percent * audioEl.duration;
    }
  });
  
  volumeSlider.addEventListener('input', (e) => {
    const vol = parseFloat(e.target.value);
    audioEl.volume = vol;
    volumeIcon.textContent = vol === 0 ? '🔇' : (vol < 0.3 ? '🔈' : '🔊');
  });
  
  volumeIcon.addEventListener('click', () => {
    if (audioEl.volume > 0) {
      audioEl.volume = 0;
      volumeSlider.value = 0;
      volumeIcon.textContent = '🔇';
    } else {
      audioEl.volume = 0.7;
      volumeSlider.value = 0.7;
      volumeIcon.textContent = '🔊';
    }
  });
  
  audioEl.addEventListener('ended', updateButtonUI);
  audioEl.addEventListener('play', updateButtonUI);
  audioEl.addEventListener('pause', updateButtonUI);
  
  audioEl.pause();
  updateButtonUI();
  
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    effectComposer.setSize(window.innerWidth, window.innerHeight);
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
