<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>25 Meses - Estrellas de Amor</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', 'Corbel', 'Arial', sans-serif;
  }
  
  /* Panel de título superior */
  .ui-panel {
    position: fixed;
    top: 20px;
    left: 0;
    width: 100%;
    text-align: center;
    pointer-events: none;
    z-index: 20;
    text-shadow: 0 0 15px rgba(0,0,0,0.5);
  }
  
  .title-25 {
    font-size: clamp(1.4rem, 5vw, 2.8rem);
    font-weight: 300;
    letter-spacing: 6px;
    background: linear-gradient(135deg, #ffd6a5, #f5b7a8, #ffd6a5);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(255, 180, 100, 0.5);
    margin-bottom: 8px;
  }
  
  .sub {
    font-size: clamp(0.65rem, 2.5vw, 0.85rem);
    color: #ffccaa;
    letter-spacing: 3px;
    opacity: 0.9;
    text-transform: uppercase;
  }
  
  /* Reproductor de música */
  .music-controls {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 15, 30, 0.85);
    backdrop-filter: blur(16px);
    border-radius: 60px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid rgba(255, 210, 160, 0.4);
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    z-index: 100;
    font-family: monospace;
    pointer-events: auto;
  }
  
  .play-pause {
    background: linear-gradient(135deg, #f5a97f, #e07a5f);
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: white;
    font-size: 18px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 12px rgba(240, 100, 70, 0.6);
  }
  
  .play-pause:hover {
    transform: scale(1.05);
    background: linear-gradient(135deg, #f7b787, #e8876a);
  }
  
  .progress-bar-bg {
    flex: 1;
    width: 180px;
    max-width: 260px;
    height: 4px;
    background: rgba(255,255,240,0.25);
    border-radius: 4px;
    cursor: pointer;
  }
  
  .progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #ffb48a, #ff8c6b);
    border-radius: 4px;
  }
  
  .time-text {
    font-size: 11px;
    color: #ffddbb;
    min-width: 80px;
    text-align: right;
    letter-spacing: 1px;
  }
  
  .volume-control {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.4);
    padding: 4px 12px;
    border-radius: 40px;
    margin-left: 5px;
  }
  
  .volume-icon {
    color: #ffccaa;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
  }
  
  .volume-slider {
    width: 70px;
    height: 3px;
    -webkit-appearance: none;
    background: rgba(255,255,240,0.3);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ffb48a;
    cursor: pointer;
    box-shadow: 0 0 5px #ffaa77;
  }
  
  @media (max-width: 650px) {
    .volume-control { padding: 2px 8px; }
    .volume-slider { width: 50px; }
    .progress-bar-bg { width: 120px; }
    .time-text { font-size: 9px; min-width: 70px; }
    .play-pause { width: 38px; height: 38px; font-size: 16px; }
    .music-controls { padding: 6px 14px; gap: 10px; }
  }
  
  .rotate-hint {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    padding: 5px 16px;
    border-radius: 40px;
    font-size: 11px;
    color: #ffd4aa;
    letter-spacing: 2px;
    font-family: monospace;
    pointer-events: none;
    z-index: 99;
    white-space: nowrap;
    border: 1px solid rgba(255,200,150,0.3);
  }
</style>
</head>
<body>
<div class="ui-panel">
  <div class="title-25">✦ 25 MESES • NUESTRO AMOR ✦</div>
  <div class="sub">ESTRELLAS QUE CAEN DEL CIELO PARA TI</div>
</div>

<div class="music-controls">
  <button class="play-pause" id="playBtn">▶</button>
  <div class="progress-bar-bg" id="progressContainer">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="time-text" id="timeDisplay">0:00 / 0:00</div>
  <div class="volume-control">
    <span class="volume-icon" id="volumeIcon">🔊</span>
    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
  </div>
</div>
<div class="rotate-hint">✨ LAS PALABRAS CAEN DEL CIELO • HAZ ZOOM CON LA RUEDA ✨</div>

<audio id="bgAudio" loop preload="auto">
  <source src="https://files.catbox.moe/pgafel.mp3" type="audio/mpeg">
</audio>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  
  // --- Escena espacial ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030318);
  scene.fog = new THREE.FogExp2(0x030318, 0.001);
  
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 12);
  camera.lookAt(0, 0, 0);
  
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);
  
  // --- Efecto Bloom ---
  const renderScene = new RenderPass(scene, camera);
  const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.3, 0.6);
  bloomPass.threshold = 0.1;
  bloomPass.strength = 0.5;
  bloomPass.radius = 0.4;
  const effectComposer = new EffectComposer(renderer);
  effectComposer.addPass(renderScene);
  effectComposer.addPass(bloomPass);
  
  // --- Control de cámara (zoom solamente) ---
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.rotateSpeed = 0;
  controls.enableZoom = true;
  controls.zoomSpeed = 1.2;
  controls.enablePan = false;
  controls.autoRotate = false;
  controls.target.set(0, 1, 0);
  controls.maxDistance = 18;
  controls.minDistance = 6;
  
  // --- Estrellas de fondo profundas ---
  const starCount = 4000;
  const starGeo = new THREE.BufferGeometry();
  const starPositions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    starPositions[i*3] = (Math.random() - 0.5) * 600;
    starPositions[i*3+1] = (Math.random() - 0.5) * 400;
    starPositions[i*3+2] = (Math.random() - 0.5) * 300 - 100;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);
  
  // --- Nebulosa / partículas de fondo ---
  const nebulaCount = 2500;
  const nebulaGeo = new THREE.BufferGeometry();
  const nebulaPositions = new Float32Array(nebulaCount * 3);
  const nebulaColors = new Float32Array(nebulaCount * 3);
  for (let i = 0; i < nebulaCount; i++) {
    nebulaPositions[i*3] = (Math.random() - 0.5) * 40;
    nebulaPositions[i*3+1] = (Math.random() - 0.5) * 25;
    nebulaPositions[i*3+2] = (Math.random() - 0.5) * 30 - 15;
    const warm = Math.random() > 0.6;
    nebulaColors[i*3] = warm ? 1.0 : 0.7;
    nebulaColors[i*3+1] = warm ? 0.6 : 0.5;
    nebulaColors[i*3+2] = warm ? 0.4 : 0.9;
  }
  nebulaGeo.setAttribute('position', new THREE.BufferAttribute(nebulaPositions, 3));
  nebulaGeo.setAttribute('color', new THREE.BufferAttribute(nebulaColors, 3));
  const nebulaMat = new THREE.PointsMaterial({ size: 0.08, vertexColors: true, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending });
  const nebula = new THREE.Points(nebulaGeo, nebulaMat);
  scene.add(nebula);
  
  // ========== FRASES QUE CAEN COMO METEORITOS ==========
  const frases = [
    { text: "✦ 25 MESES ✦", color: "#ffd700", size: 1.2, french: false },
    { text: "MI AMOR, MA CHÉRIE", color: "#ffaa88", size: 0.9, french: true },
    { text: "25 meses a tu lado", color: "#ffe3ca", size: 0.7, french: false },
    { text: "y cada día sigo enamorándome", color: "#ffe3ca", size: 0.7, french: false },
    { text: "Tus manos, tu risa, tu mirada", color: "#ffe3ca", size: 0.7, french: false },
    { text: "son mi lugar seguro, mi hogar", color: "#ffe3ca", size: 0.7, french: false },
    { text: "Gracias por cada instante", color: "#ffe3ca", size: 0.7, french: false },
    { text: "Gracias por cada sueño", color: "#ffe3ca", size: 0.7, french: false },
    { text: "JE T'AIME, MA CHÉRIE", color: "#ffaa88", size: 0.9, french: true },
    { text: "♡ ETERNAMENTE TUYA ♡", color: "#ff8899", size: 0.8, french: false },
    { text: "✦ PARA SIEMPRE ✦", color: "#ffd700", size: 1.1, french: false },
    { text: "AMORE MIO, MON TRÉSOR", color: "#ffaa88", size: 0.9, french: true },
    { text: "25 meses de magia", color: "#cbe4fe", size: 0.7, french: false },
    { text: "y una vida entera por delante", color: "#cbe4fe", size: 0.7, french: false },
    { text: "He encontrado en ti", color: "#cbe4fe", size: 0.7, french: false },
    { text: "lo que nunca busqué", color: "#cbe4fe", size: 0.7, french: false },
    { text: "Cada día a tu lado", color: "#cbe4fe", size: 0.7, french: false },
    { text: "es un regalo del cielo", color: "#cbe4fe", size: 0.7, french: false },
    { text: "JE T'AIME, MON AMOUR", color: "#ffaa88", size: 0.9, french: true },
    { text: "❤️ POR SIEMPRE JUNTOS ❤️", color: "#ff8899", size: 0.8, french: false }
  ];
  
  // Crear un sprite de texto
  function createTextSprite(message, color, size, isFrench) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 1024;
    canvas.height = 256;
    
    // Fondo transparente con glow
    ctx.fillStyle = 'rgba(0,0,0,0)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Configurar texto
    let fontSize = isFrench ? 52 : 46;
    ctx.font = `${fontSize}px "Segoe UI", "Corbel", "Arial", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    // Medir texto para ajustar canvas
    const textWidth = ctx.measureText(message).width;
    const adjustedWidth = Math.max(textWidth + 80, 300);
    canvas.width = Math.min(adjustedWidth, 900);
    canvas.height = 100;
    
    // Redibujar con el tamaño ajustado
    ctx.fillStyle = 'rgba(0,0,0,0)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = `${fontSize}px "Segoe UI", "Corbel", "Arial", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    // Sombra para efecto de brillo
    ctx.shadowBlur = 15;
    ctx.shadowColor = color;
    ctx.fillStyle = color;
    ctx.fillText(message, canvas.width/2, canvas.height/2);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(message, canvas.width/2, canvas.height/2);
    
    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending });
    const sprite = new THREE.Sprite(material);
    
    // Escala proporcional
    const scale = size * (canvas.width / 400);
    sprite.scale.set(scale, scale * 0.35, 1);
    
    return sprite;
  }
  
  // Crear todas las estrellas-frase
  const fallingStars = [];
  const spawnArea = { x: 6, y: 8 };
  
  frases.forEach((frase, index) => {
    const sprite = createTextSprite(frase.text, frase.color, frase.size, frase.french);
    // Posición inicial aleatoria en la parte superior
    const startX = (Math.random() - 0.5) * 12;
    const startY = 6 + Math.random() * 4;
    const startZ = (Math.random() - 0.5) * 8;
    sprite.position.set(startX, startY, startZ);
    
    // Velocidad de caída (lenta y variable)
    const speedY = -0.008 - Math.random() * 0.006;
    const speedX = (Math.random() - 0.5) * 0.003;
    const speedZ = (Math.random() - 0.5) * 0.003;
    
    // Rotación inicial aleatoria
    sprite.userData = {
      speedY, speedX, speedZ,
      startY: startY,
      resetY: 7,
      resetX: (Math.random() - 0.5) * 12,
      resetZ: (Math.random() - 0.5) * 8,
      active: true,
      delay: index * 0.3, // salida escalonada
      timer: 0
    };
    
    scene.add(sprite);
    fallingStars.push(sprite);
  });
  
  // --- Partículas de estela (polvo brillante) ---
  const trailCount = 800;
  const trailGeo = new THREE.BufferGeometry();
  const trailPositions = new Float32Array(trailCount * 3);
  for (let i = 0; i < trailCount; i++) {
    trailPositions[i*3] = (Math.random() - 0.5) * 20;
    trailPositions[i*3+1] = (Math.random() - 0.5) * 15;
    trailPositions[i*3+2] = (Math.random() - 0.5) * 15 - 5;
  }
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
  const trailMat = new THREE.PointsMaterial({ color: 0xffaa77, size: 0.05, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
  const trailParticles = new THREE.Points(trailGeo, trailMat);
  scene.add(trailParticles);
  
  // --- Corazones flotantes en el fondo ---
  const heartCount = 80;
  const hearts = [];
  for (let i = 0; i < heartCount; i++) {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(0,0,0,0)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = `${16 + Math.random() * 12}px "Segoe UI"`;
    ctx.fillStyle = `rgba(255, ${120 + Math.random() * 80}, ${100 + Math.random() * 80}, 0.7)`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText("❤️", canvas.width/2, canvas.height/2);
    const texture = new THREE.CanvasTexture(canvas);
    const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(0.15, 0.15, 1);
    sprite.position.set((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 8 + 2, (Math.random() - 0.5) * 12 - 4);
    sprite.userData = { floatSpeed: 0.002 + Math.random() * 0.003, floatAngle: Math.random() * Math.PI * 2 };
    scene.add(sprite);
    hearts.push(sprite);
  }
  
  // --- Iluminación ambiental ---
  const ambientLight = new THREE.AmbientLight(0x22223b);
  scene.add(ambientLight);
  const mainLight = new THREE.DirectionalLight(0xffeedd, 0.8);
  mainLight.position.set(2, 5, 3);
  scene.add(mainLight);
  const backLight = new THREE.PointLight(0x6688ff, 0.4);
  backLight.position.set(0, 2, -5);
  scene.add(backLight);
  
  // ========== ANIMACIÓN ==========
  let time = 0;
  let globalDelay = 0;
  
  function animate() {
    requestAnimationFrame(animate);
    time += 0.016;
    globalDelay += 0.008;
    
    // Animar estrellas fugaces (frases que caen)
    fallingStars.forEach((star, idx) => {
      const data = star.userData;
      
      // Control de salida escalonada
      if (globalDelay < data.delay) return;
      
      // Mover hacia abajo
      star.position.y += data.speedY;
      star.position.x += data.speedX;
      star.position.z += data.speedZ;
      
      // Rotación suave mientras caen
      star.material.rotation = time * 0.5;
      
      // Si salen de la pantalla, reaparecen arriba
      if (star.position.y < -5) {
        star.position.y = data.resetY;
        star.position.x = data.resetX;
        star.position.z = data.resetZ;
        // Pequeña variación para que no sean siempre igual
        data.speedY = -0.008 - Math.random() * 0.008;
      }
      
      // Efecto de brillo pulsante
      const pulse = 0.8 + Math.sin(time * 5 + idx) * 0.2;
      const scale = star.scale.x;
      star.scale.set(scale, scale * 0.35, 1);
      if (star.material.opacity) star.material.opacity = pulse;
    });
    
    // Animar corazones flotantes
    hearts.forEach(heart => {
      const data = heart.userData;
      data.floatAngle += data.floatSpeed;
      heart.position.y += Math.sin(data.floatAngle) * 0.003;
    });
    
    // Movimiento de fondo
    stars.rotation.y += 0.0002;
    nebula.rotation.y += 0.0003;
    nebula.rotation.x += 0.0001;
    trailParticles.rotation.y += 0.0004;
    
    effectComposer.render();
  }
  
  animate();
  
  // ========== CONTROL DE MÚSICA ==========
  const audioEl = document.getElementById('bgAudio');
  const playBtn = document.getElementById('playBtn');
  const progressFill = document.getElementById('progressFill');
  const progressContainer = document.getElementById('progressContainer');
  const timeSpan = document.getElementById('timeDisplay');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeIcon = document.getElementById('volumeIcon');
  
  audioEl.volume = 0.7;
  volumeSlider.value = 0.7;
  
  function updateButtonUI() {
    playBtn.textContent = audioEl.paused ? '▶' : '⏸';
  }
  
  playBtn.addEventListener('click', () => {
    if (audioEl.paused) {
      audioEl.play().catch(e => console.log('Error:', e));
    } else {
      audioEl.pause();
    }
    updateButtonUI();
  });
  
  audioEl.addEventListener('timeupdate', () => {
    if (audioEl.duration) {
      const percent = (audioEl.currentTime / audioEl.duration) * 100;
      progressFill.style.width = percent + '%';
      const curM = Math.floor(audioEl.currentTime / 60);
      const curS = Math.floor(audioEl.currentTime % 60);
      const durM = Math.floor(audioEl.duration / 60);
      const durS = Math.floor(audioEl.duration % 60);
      timeSpan.textContent = `${curM}:${curS.toString().padStart(2,'0')} / ${durM}:${durS.toString().padStart(2,'0')}`;
    }
  });
  
  progressContainer.addEventListener('click', (e) => {
    if (audioEl.duration) {
      const rect = progressContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const percent = x / rect.width;
      audioEl.currentTime = percent * audioEl.duration;
    }
  });
  
  volumeSlider.addEventListener('input', (e) => {
    const vol = parseFloat(e.target.value);
    audioEl.volume = vol;
    volumeIcon.textContent = vol === 0 ? '🔇' : (vol < 0.3 ? '🔈' : '🔊');
  });
  
  volumeIcon.addEventListener('click', () => {
    if (audioEl.volume > 0) {
      audioEl.volume = 0;
      volumeSlider.value = 0;
      volumeIcon.textContent = '🔇';
    } else {
      audioEl.volume = 0.7;
      volumeSlider.value = 0.7;
      volumeIcon.textContent = '🔊';
    }
  });
  
  audioEl.addEventListener('ended', updateButtonUI);
  audioEl.addEventListener('play', updateButtonUI);
  audioEl.addEventListener('pause', updateButtonUI);
  
  audioEl.pause();
  updateButtonUI();
  
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    effectComposer.setSize(window.innerWidth, window.innerHeight);
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
