<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>25 Mois - Notre Voyage</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', 'Corbel', 'Arial', sans-serif;
  }
  
  .ui-panel {
    position: fixed;
    top: 20px;
    left: 0;
    width: 100%;
    text-align: center;
    pointer-events: none;
    z-index: 20;
    text-shadow: 0 0 15px rgba(0,0,0,0.5);
  }
  
  .title-25 {
    font-size: clamp(1.6rem, 6vw, 3rem);
    font-weight: 300;
    letter-spacing: 6px;
    background: linear-gradient(135deg, #ffd6a5, #f5b7a8);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(255, 180, 100, 0.4);
    margin-bottom: 8px;
  }
  
  .sub {
    font-size: clamp(0.7rem, 3vw, 0.9rem);
    color: #ffccaa;
    letter-spacing: 2px;
    opacity: 0.8;
  }
  
  .music-controls {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 15, 30, 0.85);
    backdrop-filter: blur(16px);
    border-radius: 60px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid rgba(255, 210, 160, 0.4);
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    z-index: 100;
    font-family: monospace;
    pointer-events: auto;
  }
  
  .play-pause {
    background: linear-gradient(135deg, #f5a97f, #e07a5f);
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: white;
    font-size: 18px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 12px rgba(240, 100, 70, 0.6);
  }
  
  .play-pause:hover {
    transform: scale(1.05);
    background: linear-gradient(135deg, #f7b787, #e8876a);
  }
  
  .progress-bar-bg {
    flex: 1;
    width: 180px;
    max-width: 260px;
    height: 4px;
    background: rgba(255,255,240,0.25);
    border-radius: 4px;
    cursor: pointer;
  }
  
  .progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #ffb48a, #ff8c6b);
    border-radius: 4px;
  }
  
  .time-text {
    font-size: 11px;
    color: #ffddbb;
    min-width: 80px;
    text-align: right;
    letter-spacing: 1px;
  }
  
  .volume-control {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.4);
    padding: 4px 12px;
    border-radius: 40px;
    margin-left: 5px;
  }
  
  .volume-icon {
    color: #ffccaa;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
  }
  
  .volume-slider {
    width: 70px;
    height: 3px;
    -webkit-appearance: none;
    background: rgba(255,255,240,0.3);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ffb48a;
    cursor: pointer;
    box-shadow: 0 0 5px #ffaa77;
  }
  
  @media (max-width: 650px) {
    .volume-control { padding: 2px 8px; }
    .volume-slider { width: 50px; }
    .progress-bar-bg { width: 120px; }
    .time-text { font-size: 9px; min-width: 70px; }
    .play-pause { width: 38px; height: 38px; font-size: 16px; }
    .music-controls { padding: 6px 14px; gap: 10px; }
  }
  
  @media (max-width: 500px) {
    .volume-slider { width: 40px; }
    .volume-icon { font-size: 11px; }
    .volume-control { gap: 4px; }
  }
  
  .rotate-hint {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    padding: 4px 12px;
    border-radius: 40px;
    font-size: 11px;
    color: #ffd4aa;
    letter-spacing: 1px;
    font-family: monospace;
    pointer-events: none;
    z-index: 99;
    white-space: nowrap;
  }
  
  @media (max-width: 500px) {
    .rotate-hint { bottom: 80px; font-size: 9px; }
  }
</style>
</head>
<body>
<div class="ui-panel">
  <div class="title-25">25 MOIS • NOTRE HISTOIRE</div>
  <div class="sub">L'AMOUR N'A PAS DE FRONTIÈRES</div>
</div>
<div class="music-controls">
  <button class="play-pause" id="playBtn">▶</button>
  <div class="progress-bar-bg" id="progressContainer">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="time-text" id="timeDisplay">0:00 / 0:00</div>
  <div class="volume-control">
    <span class="volume-icon" id="volumeIcon">🔊</span>
    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
  </div>
</div>
<div class="rotate-hint">〰️ Gira con el ratón 〰️</div>

<audio id="bgAudio" loop preload="auto">
  <source src="https://files.catbox.moe/pgafel.mp3" type="audio/mpeg">
</audio>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  
  // --- Escena espacial romántica ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050518);
  scene.fog = new THREE.FogExp2(0x050518, 0.002);
  
  const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0.5, 5.2);
  camera.lookAt(0, 0, 0);
  
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);
  
  // --- Efecto Bloom ---
  const renderScene = new RenderPass(scene, camera);
  const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.3, 0.7);
  bloomPass.threshold = 0.2;
  bloomPass.strength = 0.45;
  bloomPass.radius = 0.4;
  const effectComposer = new EffectComposer(renderer);
  effectComposer.addPass(renderScene);
  effectComposer.addPass(bloomPass);
  
  // --- Control interactivo ---
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.rotateSpeed = 1.2;
  controls.zoomSpeed = 1.0;
  controls.enableZoom = true;
  controls.enablePan = false;
  controls.autoRotate = false;
  controls.target.set(0, 0, 0);
  controls.maxDistance = 7.8;
  controls.minDistance = 2.8;
  
  // --- Fondo de estrellas ---
  const starCount = 3200;
  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    starPos[i*3] = (Math.random() - 0.5) * 400;
    starPos[i*3+1] = (Math.random() - 0.5) * 240;
    starPos[i*3+2] = (Math.random() - 0.5) * 180 - 70;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);
  
  // --- Partículas doradas ---
  const glowCount = 1000;
  const glowGeo = new THREE.BufferGeometry();
  const glowPositions = new Float32Array(glowCount * 3);
  for (let i = 0; i < glowCount; i++) {
    glowPositions[i*3] = (Math.random() - 0.5) * 20;
    glowPositions[i*3+1] = (Math.random() - 0.5) * 14;
    glowPositions[i*3+2] = (Math.random() - 0.5) * 16 - 4;
  }
  glowGeo.setAttribute('position', new THREE.BufferAttribute(glowPositions, 3));
  const glowMat = new THREE.PointsMaterial({ color: 0xffaa77, size: 0.03, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
  const glowParticles = new THREE.Points(glowGeo, glowMat);
  scene.add(glowParticles);
  
  // ========== TEXTO LADO A (FRANCÉS) ==========
  const textA = "✦ 25 MOIS ✦\n\nMON AMOUR, MA CHÉRIE\n\nDEPUIS 25 LUNES\nTU FAIS BRILLER MES JOURS\n\nCHAQUE INSTANT AVEC TOI\nEST UNE ÉTOILE DANS MON CIEL\n\nJE T'AIME PLUS CHAQUE JOUR\n\n♡ MON TRÉSOR ♡";
  
  // ========== TEXTO LADO B (ITALIANO) ==========
  const textB = "✦ PER SEMPRE ✦\n\nAMORE MIO, TESORO MIO\n\n25 MESI DI MAGIA\nINSIEME ABBIAMO\nDIPINTO L'INFINITO\n\nLA TUA MANO NELLA MIA\nÈ LA MIA CASA\n\nJE T'AIME MON AMOUR\n\n❤️ AMORE MIO ❤️";
  
  // Función para crear textura con texto
  function createTextTexture(content, bgGradientColors, borderColor, textColor) {
    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 1024;
    const ctx = canvas.getContext('2d');
    
    // Fondo con gradiente
    const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    grad.addColorStop(0, bgGradientColors[0]);
    grad.addColorStop(0.5, bgGradientColors[1]);
    grad.addColorStop(1, bgGradientColors[2]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Borde decorativo
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 12;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    // Dibujar líneas de texto
    const lines = content.split('\n');
    const lineHeight = 68;
    const startY = canvas.height / 2 - (lines.length * lineHeight) / 2;
    
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    lines.forEach((line, idx) => {
      // Determinar tamaño de fuente según la línea
      if (line.includes('✦') || line.includes('❤️') || line.includes('♡')) {
        ctx.font = `54px "Segoe UI", "Corbel", "Arial", sans-serif`;
        ctx.fillStyle = '#ffcf9a';
      } else if (line.includes('MON AMOUR') || line.includes('AMORE MIO') || line.includes('MA CHÉRIE') || line.includes('TESORO MIO')) {
        ctx.font = `44px "Segoe UI", "Corbel", "Arial", sans-serif`;
        ctx.fillStyle = '#ffaa88';
      } else if (line.trim() === '') {
        return;
      } else {
        ctx.font = `36px "Segoe UI", "Corbel", "Arial", sans-serif`;
        ctx.fillStyle = textColor;
      }
      
      // Efecto de sombra/brillo
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ffaa77';
      ctx.fillText(line, canvas.width/2, startY + idx * lineHeight);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(line, canvas.width/2, startY + idx * lineHeight);
    });
    
    // Decoraciones
    ctx.font = `36px "Segoe UI"`;
    ctx.fillStyle = '#ff8899';
    ctx.fillText("✨", canvas.width/2 - 120, canvas.height - 70);
    ctx.fillText("✨", canvas.width/2 + 120, canvas.height - 70);
    
    const texture = new THREE.CanvasTexture(canvas);
    texture.needsUpdate = true;
    return texture;
  }
  
  // Crear texturas
  const textureA = createTextTexture(
    textA,
    ['#2a1a35', '#1e1228', '#100b18'],
    '#ffc49b',
    '#ffe3ca'
  );
  
  const textureB = createTextTexture(
    textB,
    ['#1f2a3a', '#121a27', '#0a0f18'],
    '#aac9ff',
    '#cbe4fe'
  );
  
  // --- Crear el cubo mensaje ---
  const messageGroup = new THREE.Group();
  const geometry = new THREE.BoxGeometry(3.0, 3.0, 0.2);
  const materials = [
    new THREE.MeshStandardMaterial({ map: textureB, roughness: 0.25, metalness: 0.1, emissive: '#221c2a', emissiveIntensity: 0.15 }),
    new THREE.MeshStandardMaterial({ map: textureA, roughness: 0.25, metalness: 0.1, emissive: '#1e1726', emissiveIntensity: 0.15 }),
    new THREE.MeshStandardMaterial({ color: 0x331e2c, roughness: 0.6 }),
    new THREE.MeshStandardMaterial({ color: 0x331e2c, roughness: 0.6 }),
    new THREE.MeshStandardMaterial({ color: 0x4a2a3a, roughness: 0.5 }),
    new THREE.MeshStandardMaterial({ color: 0x4a2a3a, roughness: 0.5 })
  ];
  const messageBox = new THREE.Mesh(geometry, materials);
  messageBox.castShadow = true;
  messageGroup.add(messageBox);
  
  // Anillo de partículas decorativo
  const haloCount = 400;
  const haloGeo = new THREE.BufferGeometry();
  const haloPos = new Float32Array(haloCount * 3);
  for (let i = 0; i < haloCount; i++) {
    const rad = 2.1 + Math.random() * 0.6;
    const ang = Math.random() * Math.PI * 2;
    const yoff = (Math.random() - 0.5) * 1.6;
    haloPos[i*3] = Math.cos(ang) * rad;
    haloPos[i*3+1] = yoff;
    haloPos[i*3+2] = Math.sin(ang) * rad;
  }
  haloGeo.setAttribute('position', new THREE.BufferAttribute(haloPos, 3));
  const haloMat = new THREE.PointsMaterial({ color: 0xffb88a, size: 0.028, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
  const haloPoints = new THREE.Points(haloGeo, haloMat);
  messageGroup.add(haloPoints);
  
  scene.add(messageGroup);
  
  // --- Estrellitas orbitando ---
  const orbCount = 250;
  const orbPositions = new Float32Array(orbCount * 3);
  for (let i = 0; i < orbCount; i++) {
    const r = 2.0 + Math.random() * 0.8;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI * 2;
    orbPositions[i*3] = Math.sin(theta) * Math.cos(phi) * r;
    orbPositions[i*3+1] = Math.sin(theta) * Math.sin(phi) * r * 0.6;
    orbPositions[i*3+2] = Math.cos(theta) * r;
  }
  const orbBufferGeo = new THREE.BufferGeometry();
  orbBufferGeo.setAttribute('position', new THREE.BufferAttribute(orbPositions, 3));
  const orbMatStars = new THREE.PointsMaterial({ color: 0xffc89c, size: 0.032, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
  const orbitingStarsObj = new THREE.Points(orbBufferGeo, orbMatStars);
  scene.add(orbitingStarsObj);
  
  const originalOrbPos = orbPositions.slice();
  
  // --- Iluminación ---
  const ambientLight = new THREE.AmbientLight(0x22223b);
  scene.add(ambientLight);
  const mainLight = new THREE.DirectionalLight(0xffeedd, 1.0);
  mainLight.position.set(4, 8, 5);
  scene.add(mainLight);
  const backLight = new THREE.PointLight(0x6688ff, 0.5);
  backLight.position.set(0, 1, -5);
  scene.add(backLight);
  const warmLight = new THREE.PointLight(0xffaa66, 0.6);
  warmLight.position.set(2, -1, 2);
  scene.add(warmLight);
  
  // --- Animación ---
  let time = 0;
  
  function animateScene() {
    requestAnimationFrame(animateScene);
    time += 0.012;
    
    messageGroup.rotation.y = Math.sin(time * 0.15) * 0.08;
    messageGroup.rotation.x = Math.sin(time * 0.2) * 0.04;
    
    const positions = orbitingStarsObj.geometry.attributes.position.array;
    for (let i = 0; i < orbCount; i++) {
      const origX = originalOrbPos[i*3];
      const origZ = originalOrbPos[i*3+2];
      const angle = time * 0.6;
      const newX = origX * Math.cos(angle) + origZ * Math.sin(angle);
      const newZ = -origX * Math.sin(angle) + origZ * Math.cos(angle);
      positions[i*3] = newX;
      positions[i*3+2] = newZ;
    }
    orbitingStarsObj.geometry.attributes.position.needsUpdate = true;
    
    stars.rotation.y += 0.0002;
    stars.rotation.x += 0.0001;
    glowParticles.rotation.y += 0.0004;
    
    effectComposer.render();
  }
  
  animateScene();
  
  // --- Control de música ---
  const audioEl = document.getElementById('bgAudio');
  const playBtn = document.getElementById('playBtn');
  const progressFill = document.getElementById('progressFill');
  const progressContainer = document.getElementById('progressContainer');
  const timeSpan = document.getElementById('timeDisplay');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeIcon = document.getElementById('volumeIcon');
  
  audioEl.volume = 0.7;
  volumeSlider.value = 0.7;
  
  function updateButtonUI() {
    playBtn.textContent = audioEl.paused ? '▶' : '⏸';
  }
  
  playBtn.addEventListener('click', () => {
    if (audioEl.paused) {
      audioEl.play();
    } else {
      audioEl.pause();
    }
    updateButtonUI();
  });
  
  audioEl.addEventListener('timeupdate', () => {
    if (audioEl.duration) {
      const percent = (audioEl.currentTime / audioEl.duration) * 100;
      progressFill.style.width = percent + '%';
      const curM = Math.floor(audioEl.currentTime / 60);
      const curS = Math.floor(audioEl.currentTime % 60);
      const durM = Math.floor(audioEl.duration / 60);
      const durS = Math.floor(audioEl.duration % 60);
      timeSpan.textContent = `${curM}:${curS.toString().padStart(2,'0')} / ${durM}:${durS.toString().padStart(2,'0')}`;
    }
  });
  
  progressContainer.addEventListener('click', (e) => {
    if (audioEl.duration) {
      const rect = progressContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const percent = x / rect.width;
      audioEl.currentTime = percent * audioEl.duration;
    }
  });
  
  volumeSlider.addEventListener('input', (e) => {
    const vol = parseFloat(e.target.value);
    audioEl.volume = vol;
    volumeIcon.textContent = vol === 0 ? '🔇' : (vol < 0.3 ? '🔈' : '🔊');
  });
  
  volumeIcon.addEventListener('click', () => {
    if (audioEl.volume > 0) {
      audioEl.volume = 0;
      volumeSlider.value = 0;
      volumeIcon.textContent = '🔇';
    } else {
      audioEl.volume = 0.7;
      volumeSlider.value = 0.7;
      volumeIcon.textContent = '🔊';
    }
  });
  
  audioEl.addEventListener('ended', updateButtonUI);
  audioEl.addEventListener('play', updateButtonUI);
  audioEl.addEventListener('pause', updateButtonUI);
  
  audioEl.pause();
  updateButtonUI();
  
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    effectComposer.setSize(window.innerWidth, window.innerHeight);
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  
  // Refrescar texturas periódicamente (por si acaso)
  setInterval(() => {
    textureA.needsUpdate = true;
    textureB.needsUpdate = true;
  }, 1000);
</script>
</body>
</html>
