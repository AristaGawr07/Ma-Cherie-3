<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>25 Meses - Nuestro Amor</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', 'Corbel', 'Arial', sans-serif;
  }
  
  .ui-panel {
    position: fixed;
    top: 20px;
    left: 0;
    width: 100%;
    text-align: center;
    pointer-events: none;
    z-index: 20;
    text-shadow: 0 0 15px rgba(0,0,0,0.5);
  }
  
  .title-25 {
    font-size: clamp(1.4rem, 5vw, 2.8rem);
    font-weight: 300;
    letter-spacing: 6px;
    background: linear-gradient(135deg, #ffd6a5, #f5b7a8, #ffd6a5);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(255, 180, 100, 0.5);
    margin-bottom: 8px;
  }
  
  .sub {
    font-size: clamp(0.65rem, 2.5vw, 0.85rem);
    color: #ffccaa;
    letter-spacing: 3px;
    opacity: 0.9;
    text-transform: uppercase;
  }
  
  .music-controls {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 15, 30, 0.85);
    backdrop-filter: blur(16px);
    border-radius: 60px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid rgba(255, 210, 160, 0.4);
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    z-index: 100;
    font-family: monospace;
    pointer-events: auto;
  }
  
  .play-pause {
    background: linear-gradient(135deg, #f5a97f, #e07a5f);
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: white;
    font-size: 18px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 12px rgba(240, 100, 70, 0.6);
  }
  
  .play-pause:hover {
    transform: scale(1.05);
    background: linear-gradient(135deg, #f7b787, #e8876a);
  }
  
  .progress-bar-bg {
    flex: 1;
    width: 180px;
    max-width: 260px;
    height: 4px;
    background: rgba(255,255,240,0.25);
    border-radius: 4px;
    cursor: pointer;
  }
  
  .progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #ffb48a, #ff8c6b);
    border-radius: 4px;
  }
  
  .time-text {
    font-size: 11px;
    color: #ffddbb;
    min-width: 80px;
    text-align: right;
    letter-spacing: 1px;
  }
  
  .volume-control {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.4);
    padding: 4px 12px;
    border-radius: 40px;
    margin-left: 5px;
  }
  
  .volume-icon {
    color: #ffccaa;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
  }
  
  .volume-slider {
    width: 70px;
    height: 3px;
    -webkit-appearance: none;
    background: rgba(255,255,240,0.3);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ffb48a;
    cursor: pointer;
    box-shadow: 0 0 5px #ffaa77;
  }
  
  @media (max-width: 650px) {
    .volume-control { padding: 2px 8px; }
    .volume-slider { width: 50px; }
    .progress-bar-bg { width: 120px; }
    .time-text { font-size: 9px; min-width: 70px; }
    .play-pause { width: 38px; height: 38px; font-size: 16px; }
    .music-controls { padding: 6px 14px; gap: 10px; }
  }
  
  .rotate-hint {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    padding: 5px 16px;
    border-radius: 40px;
    font-size: 11px;
    color: #ffd4aa;
    letter-spacing: 2px;
    font-family: monospace;
    pointer-events: none;
    z-index: 99;
    white-space: nowrap;
    border: 1px solid rgba(255,200,150,0.3);
  }
  
  @media (max-width: 500px) {
    .rotate-hint { bottom: 80px; font-size: 9px; }
  }
</style>
</head>
<body>
<div class="ui-panel">
  <div class="title-25">✦ 25 MESES • NUESTRO AMOR ✦</div>
  <div class="sub">CADA DÍA CONTIGO ES UNA ESTRELLA EN MI CIELO</div>
</div>
<div class="music-controls">
  <button class="play-pause" id="playBtn">▶</button>
  <div class="progress-bar-bg" id="progressContainer">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="time-text" id="timeDisplay">0:00 / 0:00</div>
  <div class="volume-control">
    <span class="volume-icon" id="volumeIcon">🔊</span>
    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
  </div>
</div>
<div class="rotate-hint">〰️ GIRA EL MENSAJE CON EL RATÓN 〰️</div>

<audio id="bgAudio" loop preload="auto">
  <source src="https://files.catbox.moe/pgafel.mp3" type="audio/mpeg">
</audio>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  
  // --- Escena ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030318);
  scene.fog = new THREE.FogExp2(0x030318, 0.0015);
  
  const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0.3, 5.8);
  camera.lookAt(0, 0, 0);
  
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);
  
  // --- Efecto Bloom ---
  const renderScene = new RenderPass(scene, camera);
  const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.9, 0.3, 0.7);
  bloomPass.threshold = 0.1;
  bloomPass.strength = 0.5;
  bloomPass.radius = 0.4;
  const effectComposer = new EffectComposer(renderer);
  effectComposer.addPass(renderScene);
  effectComposer.addPass(bloomPass);
  
  // --- Control interactivo ---
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.rotateSpeed = 1.0;
  controls.zoomSpeed = 1.0;
  controls.enableZoom = true;
  controls.enablePan = false;
  controls.autoRotate = false;
  controls.target.set(0, 0, 0);
  controls.maxDistance = 8.5;
  controls.minDistance = 2.8;
  
  // --- Estrellas de fondo ---
  const starCount = 3000;
  const starGeo = new THREE.BufferGeometry();
  const starPositions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    starPositions[i*3] = (Math.random() - 0.5) * 500;
    starPositions[i*3+1] = (Math.random() - 0.5) * 300;
    starPositions[i*3+2] = (Math.random() - 0.5) * 250 - 100;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);
  
  // --- Partículas doradas ---
  const dustCount = 2000;
  const dustGeo = new THREE.BufferGeometry();
  const dustPositions = new Float32Array(dustCount * 3);
  for (let i = 0; i < dustCount; i++) {
    dustPositions[i*3] = (Math.random() - 0.5) * 25;
    dustPositions[i*3+1] = (Math.random() - 0.5) * 18;
    dustPositions[i*3+2] = (Math.random() - 0.5) * 20 - 6;
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
  const dustMat = new THREE.PointsMaterial({ color: 0xffaa77, size: 0.035, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
  const dustParticles = new THREE.Points(dustGeo, dustMat);
  scene.add(dustParticles);
  
  // ========== FUNCIÓN SIMPLE PARA CREAR TEXTO ==========
  function createTextTexture(content, textColor, bgColor) {
    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 1024;
    const ctx = canvas.getContext('2d');
    
    // Fondo
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Borde decorativo
    ctx.strokeStyle = textColor;
    ctx.lineWidth = 6;
    ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);
    ctx.strokeStyle = '#ffffff40';
    ctx.lineWidth = 2;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    // Texto
    const lines = content.split('\n');
    const lineHeight = 72;
    const startY = canvas.height / 2 - (lines.length * lineHeight) / 2;
    
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    lines.forEach((line, idx) => {
      const yPos = startY + idx * lineHeight;
      
      if (line.includes('✦') || line.includes('❤️') || line.includes('♡')) {
        ctx.font = `56px "Segoe UI", "Corbel", sans-serif`;
        ctx.fillStyle = '#ffcf9a';
        ctx.fillText(line, canvas.width/2, yPos);
      }
      else if (line.includes('MA CHÉRIE') || line.includes('MON AMOUR') || line.includes('AMORE MIO') || line.includes('MON TRÉSOR')) {
        ctx.font = `48px "Segoe UI", "Corbel", sans-serif`;
        ctx.fillStyle = '#ffaa88';
        ctx.fillText(line, canvas.width/2, yPos);
      }
      else if (line.includes('JE T')) {
        ctx.font = `46px "Segoe UI", "Corbel", sans-serif`;
        ctx.fillStyle = '#ffbb99';
        ctx.fillText(line, canvas.width/2, yPos);
      }
      else if (line.trim() === '') {
        return;
      }
      else {
        ctx.font = `36px "Segoe UI", "Corbel", sans-serif`;
        ctx.fillStyle = textColor;
        ctx.fillText(line, canvas.width/2, yPos);
      }
    });
    
    // Decoraciones
    ctx.font = `32px "Segoe UI"`;
    ctx.fillStyle = '#ffaa88';
    ctx.fillText("✨", canvas.width/2 - 130, canvas.height - 60);
    ctx.fillText("✨", canvas.width/2 + 130, canvas.height - 60);
    ctx.fillText("⭐", canvas.width/2 - 140, 70);
    ctx.fillText("⭐", canvas.width/2 + 140, 70);
    
    const texture = new THREE.CanvasTexture(canvas);
    texture.needsUpdate = true;
    return texture;
  }
  
  // ========== TEXTOS EN ESPAÑOL CON TÉRMINOS FRANCESES ==========
  
  // Cara A
  const textFront = `✦ 25 MESES ✦

MI AMOR, MA CHÉRIE

25 MESES A TU LADO
Y CADA DÍA SIGO ENAMORÁNDOME

TUS MANOS, TU RISA, TU MIRADA
SON MI LUGAR SEGURO, MI HOGAR

GRACIAS POR CADA INSTANTE
GRACIAS POR CADA SUEÑO

JE T'AIME, MA CHÉRIE

♡ ETERNAMENTE TUYA ♡`;
  
  // Cara B
  const textBack = `✦ PARA SIEMPRE ✦

AMORE MIO, MON TRÉSOR

25 MESES DE MAGIA
Y UNA VIDA ENTERA POR DELANTE

HE ENCONTRADO EN TI
LO QUE NUNCA BUSQUÉ

CADA DÍA A TU LADO
ES UN REGALO DEL CIELO

JE T'AIME, MON AMOUR

❤️ POR SIEMPRE JUNTOS ❤️`;
  
  const textureFront = createTextTexture(textFront, '#ffe3ca', '#1a1028');
  const textureBack = createTextTexture(textBack, '#cbe4fe', '#101528');
  
  // ========== CREAR TARJETA (Mensaje flotante) ==========
  const cardGroup = new THREE.Group();
  
  // Usar BoxGeometry para que tenga grosor y se vea bien desde cualquier ángulo
  const geometry = new THREE.BoxGeometry(3.0, 3.0, 0.12);
  const materials = [
    new THREE.MeshStandardMaterial({ color: 0xd49a6a, metalness: 0.6, roughness: 0.4 }), // derecha
    new THREE.MeshStandardMaterial({ color: 0xd49a6a, metalness: 0.6, roughness: 0.4 }), // izquierda
    new THREE.MeshStandardMaterial({ map: textureFront, roughness: 0.3, metalness: 0.1 }), // arriba (FRONTAL)
    new THREE.MeshStandardMaterial({ map: textureBack, roughness: 0.3, metalness: 0.1 }),  // abajo (TRASERA)
    new THREE.MeshStandardMaterial({ color: 0xb07d5a, metalness: 0.5, roughness: 0.5 }), // frente
    new THREE.MeshStandardMaterial({ color: 0xb07d5a, metalness: 0.5, roughness: 0.5 })  // atrás
  ];
  
  const messageBox = new THREE.Mesh(geometry, materials);
  messageBox.castShadow = true;
  cardGroup.add(messageBox);
  
  // Añadir un brillo alrededor (anillo de partículas)
  const ringCount = 200;
  const ringGeo = new THREE.BufferGeometry();
  const ringPositions = new Float32Array(ringCount * 3);
  for (let i = 0; i < ringCount; i++) {
    const angle = (i / ringCount) * Math.PI * 2;
    ringPositions[i*3] = Math.cos(angle) * 2.0;
    ringPositions[i*3+1] = Math.sin(angle) * 0.3;
    ringPositions[i*3+2] = Math.sin(angle) * 2.0;
  }
  ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
  const ringMat = new THREE.PointsMaterial({ color: 0xffaa88, size: 0.03, transparent: true, blending: THREE.AdditiveBlending });
  const ringParticles = new THREE.Points(ringGeo, ringMat);
  cardGroup.add(ringParticles);
  
  scene.add(cardGroup);
  
  // --- Corazones orbitantes ---
  const heartCount = 100;
  const hearts = [];
  for (let i = 0; i < heartCount; i++) {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(0,0,0,0)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = `${18 + Math.random() * 12}px "Segoe UI"`;
    ctx.fillStyle = `rgba(255, ${120 + Math.random() * 80}, ${100 + Math.random() * 80}, 0.9)`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText("❤️", canvas.width/2, canvas.height/2);
    const texture = new THREE.CanvasTexture(canvas);
    const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending });
    const sprite = new THREE.Sprite(mat);
    const radius = 2.3 + Math.random() * 0.8;
    const speed = 0.002 + Math.random() * 0.006;
    const angle = Math.random() * Math.PI * 2;
    const yOffset = (Math.random() - 0.5) * 1.4;
    sprite.userData = { radius, speed, angle, yOffset, scale: 0.18 + Math.random() * 0.08 };
    sprite.scale.set(sprite.userData.scale, sprite.userData.scale, 1);
    scene.add(sprite);
    hearts.push(sprite);
  }
  
  // --- Iluminación ---
  const ambientLight = new THREE.AmbientLight(0x22223b);
  scene.add(ambientLight);
  const mainLight = new THREE.DirectionalLight(0xffeedd, 1.0);
  mainLight.position.set(4, 8, 5);
  scene.add(mainLight);
  const fillLight = new THREE.PointLight(0xffaa77, 0.5);
  fillLight.position.set(1, 1, 3);
  scene.add(fillLight);
  const backLight = new THREE.PointLight(0x6688ff, 0.4);
  backLight.position.set(0, 1, -4);
  scene.add(backLight);
  
  // ========== ANIMACIÓN ==========
  let time = 0;
  
  function animate() {
    requestAnimationFrame(animate);
    time += 0.012;
    
    // Rotación suave de la tarjeta
    cardGroup.rotation.y = Math.sin(time * 0.1) * 0.05;
    cardGroup.rotation.x = Math.sin(time * 0.15) * 0.03;
    
    // Rotación del anillo de partículas
    ringParticles.rotation.y = time * 0.4;
    ringParticles.rotation.x = Math.sin(time * 0.5) * 0.2;
    
    // Movimiento de partículas de fondo
    dustParticles.rotation.y += 0.0005;
    stars.rotation.y += 0.0002;
    
    // Actualizar corazones orbitantes
    hearts.forEach(heart => {
      const d = heart.userData;
      d.angle += d.speed;
      const x = Math.cos(d.angle) * d.radius;
      const z = Math.sin(d.angle) * d.radius;
      heart.position.set(x, d.yOffset, z);
      const scaleAnim = d.scale + Math.sin(time * 3) * 0.02;
      heart.scale.set(scaleAnim, scaleAnim, 1);
    });
    
    effectComposer.render();
  }
  
  animate();
  
  // ========== CONTROL DE MÚSICA ==========
  const audioEl = document.getElementById('bgAudio');
  const playBtn = document.getElementById('playBtn');
  const progressFill = document.getElementById('progressFill');
  const progressContainer = document.getElementById('progressContainer');
  const timeSpan = document.getElementById('timeDisplay');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeIcon = document.getElementById('volumeIcon');
  
  audioEl.volume = 0.7;
  volumeSlider.value = 0.7;
  
  function updateButtonUI() {
    playBtn.textContent = audioEl.paused ? '▶' : '⏸';
  }
  
  playBtn.addEventListener('click', () => {
    if (audioEl.paused) {
      audioEl.play().catch(e => console.log('Error:', e));
    } else {
      audioEl.pause();
    }
    updateButtonUI();
  });
  
  audioEl.addEventListener('timeupdate', () => {
    if (audioEl.duration) {
      const percent = (audioEl.currentTime / audioEl.duration) * 100;
      progressFill.style.width = percent + '%';
      const curM = Math.floor(audioEl.currentTime / 60);
      const curS = Math.floor(audioEl.currentTime % 60);
      const durM = Math.floor(audioEl.duration / 60);
      const durS = Math.floor(audioEl.duration % 60);
      timeSpan.textContent = `${curM}:${curS.toString().padStart(2,'0')} / ${durM}:${durS.toString().padStart(2,'0')}`;
    }
  });
  
  progressContainer.addEventListener('click', (e) => {
    if (audioEl.duration) {
      const rect = progressContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const percent = x / rect.width;
      audioEl.currentTime = percent * audioEl.duration;
    }
  });
  
  volumeSlider.addEventListener('input', (e) => {
    const vol = parseFloat(e.target.value);
    audioEl.volume = vol;
    volumeIcon.textContent = vol === 0 ? '🔇' : (vol < 0.3 ? '🔈' : '🔊');
  });
  
  volumeIcon.addEventListener('click', () => {
    if (audioEl.volume > 0) {
      audioEl.volume = 0;
      volumeSlider.value = 0;
      volumeIcon.textContent = '🔇';
    } else {
      audioEl.volume = 0.7;
      volumeSlider.value = 0.7;
      volumeIcon.textContent = '🔊';
    }
  });
  
  audioEl.addEventListener('ended', updateButtonUI);
  audioEl.addEventListener('play', updateButtonUI);
  audioEl.addEventListener('pause', updateButtonUI);
  
  audioEl.pause();
  updateButtonUI();
  
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    effectComposer.setSize(window.innerWidth, window.innerHeight);
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
