<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Saturno Romántico - Viaje Estelar</title>
<style>
  html, body { margin:0; height:100%; background:#010103; overflow:hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  canvas { display:block; width: 100vw; height: 100vh; }

  /* --- Reproductor Adaptable --- */
  .player {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    max-width: 450px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    border: 1px solid rgba(255, 182, 193, 0.3);
    border-radius: 50px;
    background: rgba(10, 5, 20, 0.7);
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    z-index: 1000;
    color: #ffb6c1;
    transition: all 0.3s ease;
  }
  
  .player button {
    background: linear-gradient(135deg, #ffb6c1, #ff69b4);
    border: none;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    width: 40px;
    height: 40px;
    min-width: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
  }

  .progress {
    flex-grow: 1;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 5px;
    overflow: hidden;
    cursor: pointer;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: #ffb6c1;
    box-shadow: 0 0 15px #ff69b4;
  }
  .time { font-size: 10px; min-width: 65px; text-align: right; opacity: 0.8; }

  /* --- Etiqueta informativa --- */
  .info {
    position: fixed;
    top: 20px;
    width: 100%;
    text-align: center;
    color: rgba(255, 182, 193, 0.9);
    font-size: 10px;
    pointer-events: none;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: bold;
    text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
  }

  @media (max-width: 600px) {
    .player { padding: 8px 15px; width: 90%; }
    .info { font-size: 8px; letter-spacing: 2px; }
  } 
</style>
</head>
<body>

<div class="player">
  <button id="play">▶</button>
  <div class="progress" id="progress"><div class="progress-bar" id="progress-bar"></div></div>
  <div class="time" id="time">0:00 / 0:00</div>
</div>

<audio id="audio" loop>
  <source src="https://files.catbox.moe/pgafel.mp3" type="audio/mpeg">
</audio>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';

  // --- Setup Scene, Camera, Renderer ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x010103);
  scene.fog = new THREE.FogExp2(0x010103, 0.0008);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 3, 14);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // --- Lights ---
  const ambientLight = new THREE.AmbientLight(0x404060);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(5, 10, 7);
  dirLight.castShadow = true;
  scene.add(dirLight);
  const fillLight = new THREE.PointLight(0x8866ff, 0.5);
  fillLight.position.set(0, -3, 0);
  scene.add(fillLight);
  const rimLight = new THREE.PointLight(0xffaa88, 0.6);
  rimLight.position.set(0, 2, -5);
  scene.add(rimLight);

  // --- Stars Background ---
  const starGeometry = new THREE.BufferGeometry();
  const starCount = 2000;
  const starPositions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    starPositions[i*3] = (Math.random() - 0.5) * 400;
    starPositions[i*3+1] = (Math.random() - 0.5) * 200;
    starPositions[i*3+2] = (Math.random() - 0.5) * 100 - 50;
  }
  starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.25, transparent: true, opacity: 0.7 });
  const stars = new THREE.Points(starGeometry, starMaterial);
  scene.add(stars);

  // --- Saturn ---
  const saturnGeometry = new THREE.SphereGeometry(1.2, 128, 128);
  const saturnMaterial = new THREE.MeshStandardMaterial({
    color: 0xe8cfb0,
    emissive: 0x442200,
    emissiveIntensity: 0.25,
    roughness: 0.5,
    metalness: 0.3
  });
  const saturn = new THREE.Mesh(saturnGeometry, saturnMaterial);
  saturn.castShadow = true;
  scene.add(saturn);

  // --- Rings ---
  const ringGeometry = new THREE.TorusGeometry(1.9, 0.35, 128, 256);
  const ringMaterial = new THREE.MeshStandardMaterial({
    color: 0xccaa88,
    emissive: 0x552200,
    emissiveIntensity: 0.2,
    transparent: true,
    opacity: 0.85,
    side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(ringGeometry, ringMaterial);
  ring.rotation.x = Math.PI / 2.2;
  ring.rotation.z = 0.3;
  saturn.add(ring);

  const thinRingGeometry = new THREE.TorusGeometry(2.1, 0.12, 128, 256);
  const thinRingMaterial = new THREE.MeshStandardMaterial({
    color: 0xddbb99,
    emissive: 0x331100,
    transparent: true,
    opacity: 0.7,
    side: THREE.DoubleSide
  });
  const thinRing = new THREE.Mesh(thinRingGeometry, thinRingMaterial);
  thinRing.rotation.x = Math.PI / 2.2;
  thinRing.rotation.z = 0.2;
  saturn.add(thinRing);

  // --- Particles around Saturn ---
  const particleCount = 800;
  const particleGeo = new THREE.BufferGeometry();
  const particlePositions = new Float32Array(particleCount * 3);
  for (let i = 0; i < particleCount; i++) {
    const radius = 2.0 + Math.random() * 1.2;
    const angle = Math.random() * Math.PI * 2;
    const yOffset = (Math.random() - 0.5) * 1.0;
    particlePositions[i*3] = Math.cos(angle) * radius;
    particlePositions[i*3+1] = yOffset;
    particlePositions[i*3+2] = Math.sin(angle) * radius;
  }
  particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
  const particleMat = new THREE.PointsMaterial({ color: 0xffccaa, size: 0.05, transparent: true, opacity: 0.6 });
  const particles = new THREE.Points(particleGeo, particleMat);
  saturn.add(particles);

  // --- Palabras en órbita ---
  const words = [
    "AMOR", "PASIÓN", "ESTRELLAS", "BESOS", "LUNA", "FELICIDAD",
    "SUEÑOS", "ROMANCE", "INFINITO", "CORAZÓN", "TIERRA", "CIELO",
    "VIDA", "POESÍA", "LUZ", "ARMONÍA"
  ];
  
  const orbitingItems = [];
  const orbitRadii = [2.6, 3.2, 3.8];
  const speeds = [0.005, 0.003, 0.007];
  const colors = ["#ffb6c1", "#ff99cc", "#ffc0cb", "#ffaacc", "#ff88aa"];
  
  for (let i = 0; i < words.length; i++) {
    const word = words[i];
    const radius = orbitRadii[i % orbitRadii.length];
    const speed = speeds[i % speeds.length];
    const angle = (i / words.length) * Math.PI * 2;
    const color = colors[i % colors.length];
    
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 512;
    canvas.height = 512;
    ctx.fillStyle = 'rgba(0,0,0,0)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = `Bold ${60 + (i % 3) * 8}px "Segoe UI", "Arial"`;
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(word, canvas.width/2, canvas.height/2);
    
    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.95 });
    const sprite = new THREE.Sprite(material);
    sprite.scale.set(0.9, 0.9, 1);
    sprite.userData = {
      radius: radius,
      speed: speed,
      angle: angle,
      yOffset: (i % 3 - 1) * 0.4,
      originalScale: 0.9
    };
    scene.add(sprite);
    orbitingItems.push(sprite);
  }
  
  // --- Corazones flotantes ---
  const heartCount = 60;
  const heartSprites = [];
  for (let i = 0; i < heartCount; i++) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 64;
    canvas.height = 64;
    ctx.fillStyle = 'rgba(0,0,0,0)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = `30px "Segoe UI", "Arial"`;
    ctx.fillStyle = "#ff6699";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText("❤️", canvas.width/2, canvas.height/2);
    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.5 });
    const heart = new THREE.Sprite(material);
    heart.scale.set(0.25, 0.25, 1);
    heart.userData = {
      radius: 2.0 + Math.random() * 2.5,
      speed: 0.002 + Math.random() * 0.005,
      angle: Math.random() * Math.PI * 2,
      yOffset: (Math.random() - 0.5) * 1.2
    };
    scene.add(heart);
    heartSprites.push(heart);
  }

  // --- Animación ---
  let time = 0;
  
  function animate() {
    requestAnimationFrame(animate);
    time += 0.01;
    
    saturn.rotation.y += 0.005;
    saturn.rotation.x = Math.sin(time * 0.2) * 0.1;
    
    ring.rotation.z += 0.002;
    thinRing.rotation.z += 0.003;
    
    stars.rotation.y += 0.0002;
    stars.rotation.x += 0.0001;
    
    orbitingItems.forEach(sprite => {
      const data = sprite.userData;
      data.angle += data.speed;
      const x = Math.cos(data.angle) * data.radius;
      const z = Math.sin(data.angle) * data.radius;
      sprite.position.set(x, data.yOffset, z);
      const scale = data.originalScale + Math.sin(time * 3) * 0.03;
      sprite.scale.set(scale, scale, 1);
    });
    
    heartSprites.forEach(heart => {
      const data = heart.userData;
      data.angle += data.speed;
      const x = Math.cos(data.angle) * data.radius;
      const z = Math.sin(data.angle) * data.radius;
      heart.position.set(x, data.yOffset, z);
      heart.position.y = data.yOffset + Math.sin(time * 2) * 0.05;
    });
    
    camera.position.x += (0 - camera.position.x) * 0.02;
    camera.position.y += (3 + Math.sin(time * 0.2) * 0.1 - camera.position.y) * 0.02;
    camera.lookAt(0, 0, 0);
    
    renderer.render(scene, camera);
  }
  
  animate();

  // --- Control de audio ---
  const audioEl = document.getElementById('audio');
  const playBtn = document.getElementById('play');
  const progressBarEl = document.getElementById('progress-bar');
  const progressContainerEl = document.getElementById('progress');
  const timeDisplayEl = document.getElementById('time');

  function updatePlayButton() {
    playBtn.textContent = audioEl.paused ? '▶' : '⏸';
  }

  playBtn.addEventListener('click', () => {
    if (audioEl.paused) {
      audioEl.play();
    } else {
      audioEl.pause();
    }
    updatePlayButton();
  });

  audioEl.addEventListener('timeupdate', () => {
    const percent = (audioEl.currentTime / audioEl.duration) * 100;
    progressBarEl.style.width = percent + '%';
    const currentMin = Math.floor(audioEl.currentTime / 60);
    const currentSec = Math.floor(audioEl.currentTime % 60);
    const durationMin = Math.floor(audioEl.duration / 60);
    const durationSec = Math.floor(audioEl.duration % 60);
    timeDisplayEl.textContent = `${currentMin}:${currentSec.toString().padStart(2,'0')} / ${durationMin}:${durationSec.toString().padStart(2,'0')}`;
  });

  progressContainerEl.addEventListener('click', (e) => {
    const clickX = e.offsetX;
    const width = progressContainerEl.clientWidth;
    audioEl.currentTime = (clickX / width) * audioEl.duration;
  });

  audioEl.addEventListener('ended', updatePlayButton);
  audioEl.addEventListener('play', updatePlayButton);
  audioEl.addEventListener('pause', updatePlayButton);
  
  audioEl.play().catch(e => console.log('Autoplay bloqueado'));

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
