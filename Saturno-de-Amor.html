<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>25 Meses - Nuestro Viaje</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', 'Corbel', 'Arial', sans-serif;
  }
  
  /* Panel flotante para el título y el reproductor */
  .ui-panel {
    position: fixed;
    top: 20px;
    left: 0;
    width: 100%;
    text-align: center;
    pointer-events: none;
    z-index: 20;
    text-shadow: 0 0 15px rgba(0,0,0,0.5);
  }
  
  .title-25 {
    font-size: clamp(1.6rem, 6vw, 3rem);
    font-weight: 300;
    letter-spacing: 6px;
    color: #ffe6cc;
    background: linear-gradient(135deg, #ffd6a5, #f5b7a8);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(255, 180, 100, 0.4);
    margin-bottom: 8px;
  }
  
  .sub {
    font-size: clamp(0.7rem, 3vw, 0.9rem);
    color: #ffccaa;
    letter-spacing: 2px;
    opacity: 0.8;
  }
  
  /* Reproductor de música mejorado */
  .music-controls {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 15, 30, 0.75);
    backdrop-filter: blur(16px);
    border-radius: 50px;
    padding: 6px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid rgba(255, 210, 160, 0.4);
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    z-index: 100;
    font-family: monospace;
    pointer-events: auto;
  }
  
  .play-pause {
    background: linear-gradient(135deg, #f5a97f, #e07a5f);
    border: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: white;
    font-size: 18px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 12px rgba(240, 100, 70, 0.6);
  }
  
  .play-pause:hover {
    transform: scale(1.05);
    background: linear-gradient(135deg, #f7b787, #e8876a);
  }
  
  .progress-bar-bg {
    flex: 1;
    width: 200px;
    max-width: 280px;
    height: 4px;
    background: rgba(255,255,240,0.25);
    border-radius: 4px;
    cursor: pointer;
  }
  
  .progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #ffb48a, #ff8c6b);
    border-radius: 4px;
  }
  
  .time-text {
    font-size: 11px;
    color: #ffddbb;
    min-width: 80px;
    text-align: right;
    letter-spacing: 1px;
  }
  
  @media (max-width: 550px) {
    .progress-bar-bg { width: 140px; }
    .time-text { font-size: 9px; min-width: 70px; }
    .play-pause { width: 38px; height: 38px; font-size: 16px; }
    .music-controls { padding: 5px 14px; gap: 10px; }
  }
  
  /* Leyenda interactiva */
  .rotate-hint {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    padding: 4px 12px;
    border-radius: 40px;
    font-size: 11px;
    color: #ffd4aa;
    letter-spacing: 1px;
    font-family: monospace;
    pointer-events: none;
    z-index: 99;
    white-space: nowrap;
  }
  
  @media (max-width: 500px) {
    .rotate-hint { bottom: 80px; font-size: 9px; }
  }
</style>
</head>
<body>
<div class="ui-panel">
  <div class="title-25">25 MESES • NUESTRO VIAJE</div>
  <div class="sub">CADA DÍA, UNA NUEVA ESTRELLA</div>
</div>
<div class="music-controls">
  <button class="play-pause" id="playBtn">▶</button>
  <div class="progress-bar-bg" id="progressContainer">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="time-text" id="timeDisplay">0:00 / 0:00</div>
</div>
<div class="rotate-hint">〰️ Gira el mensaje con el ratón 〰️</div>

<audio id="bgAudio" loop preload="auto">
  <source src="https://files.catbox.moe/pgafel.mp3" type="audio/mpeg">
</audio>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  
  // --- Escena espacial romántica ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x040414);
  scene.fog = new THREE.FogExp2(0x040414, 0.0025);
  
  const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0.8, 4.5);
  camera.lookAt(0, 0, 0);
  
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.toneMapping = THREE.ReinhardToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);
  
  // --- Efecto Bloom (brillo suave) ---
  const renderScene = new RenderPass(scene, camera);
  const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.9, 0.3, 0.7);
  bloomPass.threshold = 0.2;
  bloomPass.strength = 0.5;
  bloomPass.radius = 0.4;
  const effectComposer = new EffectComposer(renderer);
  effectComposer.addPass(renderScene);
  effectComposer.addPass(bloomPass);
  
  // --- Control interactivo (rotación y zoom) ---
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.rotateSpeed = 1.2;
  controls.zoomSpeed = 1.0;
  controls.enableZoom = true;
  controls.zoomSpeed = 0.8;
  controls.enablePan = false;
  controls.autoRotate = false;
  controls.target.set(0, 0, 0);
  controls.maxDistance = 7.5;
  controls.minDistance = 2.8;
  
  // --- Fondo de estrellas (mejorado con colores cálidos) ---
  const starCount = 2800;
  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(starCount * 3);
  const starCol = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    starPos[i*3] = (Math.random() - 0.5) * 380;
    starPos[i*3+1] = (Math.random() - 0.5) * 220;
    starPos[i*3+2] = (Math.random() - 0.5) * 150 - 60;
    const warm = Math.random() > 0.7;
    if (warm) {
      starCol[i*3] = 1.0;
      starCol[i*3+1] = 0.75;
      starCol[i*3+2] = 0.55;
    } else {
      starCol[i*3] = 0.95;
      starCol[i*3+1] = 0.95;
      starCol[i*3+2] = 1.0;
    }
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
  const starMat = new THREE.PointsMaterial({ size: 0.14, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);
  
  // --- Pequeñas partículas doradas alrededor (ambiente) ---
  const glowCount = 900;
  const glowGeo = new THREE.BufferGeometry();
  const glowPositions = new Float32Array(glowCount * 3);
  for (let i = 0; i < glowCount; i++) {
    glowPositions[i*3] = (Math.random() - 0.5) * 18;
    glowPositions[i*3+1] = (Math.random() - 0.5) * 12;
    glowPositions[i*3+2] = (Math.random() - 0.5) * 14 - 3;
  }
  glowGeo.setAttribute('position', new THREE.BufferAttribute(glowPositions, 3));
  const glowMat = new THREE.PointsMaterial({ color: 0xffaa77, size: 0.035, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
  const glowParticles = new THREE.Points(glowGeo, glowMat);
  scene.add(glowParticles);
  
  // --- Mensaje Central con dos caras (lado A y lado B) ---
  // Creamos un grupo que rotará entero
  const messageGroup = new THREE.Group();
  
  // --- Función para crear texto con canvas (texto nítido) ---
  function createTextTexture(text, bgColor, textColor, fontSizePx = 52) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 1024;
    canvas.height = 1024;
    // Fondo transparente con un ligero radial (para dar profundidad)
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Sombra para efecto de relieve
    ctx.shadowBlur = 0;
    ctx.font = `${fontSizePx}px "Segoe UI", "Corbel", "Arial", sans-serif`;
    ctx.fillStyle = textColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // Efecto de brillo en el texto
    for (let i = 0; i < 3; i++) {
      ctx.shadowBlur = 14;
      ctx.shadowColor = textColor;
      ctx.fillText(text, canvas.width/2, canvas.height/2);
    }
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff9f0';
    ctx.fillText(text, canvas.width/2, canvas.height/2);
    
    return new THREE.CanvasTexture(canvas);
  }
  
  // Texto para el Lado A (25 meses - mensajes de viaje y momentos)
  const sideAText = `✦ 25 MESES ✦\n\nCADA INSTA NTE CONTIGO\nES UN VIAJE SIN MAPA\nTÚ Y YO \nCOMPLICES, CÓMPLICES\nENTRE RÍAS Y ESTRELLAS\n\nEL MEJOR PLAN \nES SEGUIR SOÑANDO\nCONTIGO.`;
  
  // Texto para el Lado B (recuerdos y futuro)
  const sideBText = `✦ PARA SIEMPRE ✦\n\nRECUERDO TUS MANOS\nTUS PASOS, TU RISA\nCADA MES MÁS CERCA\nCADA DÍA MÁS NOSOTROS\n\n25 MESES SON\n25 PROMESAS CUMPLIDAS\nY MILES POR VIVIR\n\nTE QUIERO.\n(HASTA EL INFINITO)`;
  
  // Crear texturas para ambos lados (con fondo degradado suave)
  const canvasA = document.createElement('canvas');
  canvasA.width = 1024;
  canvasA.height = 1024;
  const ctxA = canvasA.getContext('2d');
  // Fondo con gradiente radial (tonos cálidos y románticos)
  const gradA = ctxA.createLinearGradient(0, 0, canvasA.width, canvasA.height);
  gradA.addColorStop(0, '#2a1a35');
  gradA.addColorStop(0.5, '#1e1228');
  gradA.addColorStop(1, '#100b18');
  ctxA.fillStyle = gradA;
  ctxA.fillRect(0, 0, canvasA.width, canvasA.height);
  // Marco decorativo sutil
  ctxA.strokeStyle = '#ffc49b';
  ctxA.lineWidth = 12;
  ctxA.strokeRect(40, 40, canvasA.width - 80, canvasA.height - 80);
  ctxA.fillStyle = '#ffdcc0';
  ctxA.font = `44px "Segoe UI", "Corbel", "Arial", sans-serif`;
  ctxA.textAlign = 'center';
  ctxA.shadowBlur = 0;
  // Dibujar líneas de texto con espaciado manual
  const linesA = sideAText.split('\n');
  let startY = canvasA.height / 2 - (linesA.length * 32) / 2;
  linesA.forEach((line, idx) => {
    ctxA.fillStyle = idx === 0 ? '#ffcf9a' : '#ffe3ca';
    ctxA.font = idx === 0 ? `52px "Segoe UI", "Corbel", sans-serif` : `36px "Segoe UI", "Corbel", sans-serif`;
    ctxA.fillText(line, canvasA.width/2, startY + idx * 58);
  });
  // Añadir pequeños corazones decorativos
  ctxA.font = `28px "Segoe UI"`;
  ctxA.fillStyle = '#ffaa88';
  ctxA.fillText("❤️", canvasA.width/2 - 70, canvasA.height - 70);
  ctxA.fillText("❤️", canvasA.width/2 + 70, canvasA.height - 70);
  
  const textureA = new THREE.CanvasTexture(canvasA);
  
  // Lado B
  const canvasB = document.createElement('canvas');
  canvasB.width = 1024;
  canvasB.height = 1024;
  const ctxB = canvasB.getContext('2d');
  const gradB = ctxB.createLinearGradient(0, 0, canvasB.width, canvasB.height);
  gradB.addColorStop(0, '#1f2a3a');
  gradB.addColorStop(0.5, '#121a27');
  gradB.addColorStop(1, '#0a0f18');
  ctxB.fillStyle = gradB;
  ctxB.fillRect(0, 0, canvasB.width, canvasB.height);
  ctxB.strokeStyle = '#aac9ff';
  ctxB.lineWidth = 12;
  ctxB.strokeRect(40, 40, canvasB.width - 80, canvasB.height - 80);
  const linesB = sideBText.split('\n');
  let startYB = canvasB.height / 2 - (linesB.length * 32) / 2;
  linesB.forEach((line, idx) => {
    ctxB.fillStyle = idx === 0 ? '#ffcf9a' : '#cbe4fe';
    ctxB.font = idx === 0 ? `52px "Segoe UI", "Corbel", sans-serif` : `34px "Segoe UI", "Corbel", sans-serif`;
    ctxB.fillText(line, canvasB.width/2, startYB + idx * 52);
  });
  ctxB.font = `28px "Segoe UI"`;
  ctxB.fillStyle = '#ffaa88';
  ctxB.fillText("❤️", canvasB.width/2 - 70, canvasB.height - 70);
  ctxB.fillText("❤️", canvasB.width/2 + 70, canvasB.height - 70);
  const textureB = new THREE.CanvasTexture(canvasB);
  
  // Crear dos planos (uno para cada lado) y unirlos espalda con espalda
  const geometry = new THREE.BoxGeometry(2.8, 2.8, 0.15);
  const materials = [
    new THREE.MeshStandardMaterial({ map: textureB, roughness: 0.3, metalness: 0.1, emissive: '#221c2a', emissiveIntensity: 0.2 }), // derecha (lado B)
    new THREE.MeshStandardMaterial({ map: textureA, roughness: 0.3, metalness: 0.1, emissive: '#1e1726', emissiveIntensity: 0.2 }), // izquierda (lado A)
    new THREE.MeshStandardMaterial({ color: 0x331e2c, roughness: 0.6 }), // arriba
    new THREE.MeshStandardMaterial({ color: 0x331e2c, roughness: 0.6 }), // abajo
    new THREE.MeshStandardMaterial({ color: 0x553d4a, roughness: 0.5 }), // frente
    new THREE.MeshStandardMaterial({ color: 0x553d4a, roughness: 0.5 })  // atrás
  ];
  const messageBox = new THREE.Mesh(geometry, materials);
  messageBox.castShadow = true;
  messageBox.receiveShadow = false;
  messageGroup.add(messageBox);
  
  // Añadir un leve resplandor alrededor del mensaje (partículas en anillo)
  const haloCount = 300;
  const haloGeo = new THREE.BufferGeometry();
  const haloPos = new Float32Array(haloCount * 3);
  for (let i = 0; i < haloCount; i++) {
    const rad = 1.9 + Math.random() * 0.5;
    const ang = Math.random() * Math.PI * 2;
    const yoff = (Math.random() - 0.5) * 1.5;
    haloPos[i*3] = Math.cos(ang) * rad;
    haloPos[i*3+1] = yoff;
    haloPos[i*3+2] = Math.sin(ang) * rad;
  }
  haloGeo.setAttribute('position', new THREE.BufferAttribute(haloPos, 3));
  const haloMat = new THREE.PointsMaterial({ color: 0xffb88a, size: 0.022, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
  const haloPoints = new THREE.Points(haloGeo, haloMat);
  messageGroup.add(haloPoints);
  
  scene.add(messageGroup);
  
  // --- Elementos decorativos: estrellitas orbitando alrededor del mensaje ---
  const orbCount = 180;
  const orbGroup = new THREE.Group();
  const orbPositions = new Float32Array(orbCount * 3);
  for (let i = 0; i < orbCount; i++) {
    const r = 1.7 + Math.random() * 0.9;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI * 2;
    orbPositions[i*3] = Math.sin(theta) * Math.cos(phi) * r;
    orbPositions[i*3+1] = Math.sin(theta) * Math.sin(phi) * r * 0.6;
    orbPositions[i*3+2] = Math.cos(theta) * r;
  }
  orbGroup.userData = { positions: orbPositions, speeds: Array.from({ length: orbCount }, () => 0.002 + Math.random() * 0.006) };
  const orbBufferGeo = new THREE.BufferGeometry();
  orbBufferGeo.setAttribute('position', new THREE.BufferAttribute(orbPositions, 3));
  const orbMat = new THREE.PointsMaterial({ color: 0xffc89c, size: 0.028, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending });
  const orbitingStars = new THREE.Points(orbBufferGeo, orbMat);
  scene.add(orbitingStars);
  
  // --- Animación de partículas y rotación suave del grupo central ---
  let time = 0;
  
  function animateParticles() {
    requestAnimationFrame(animateParticles);
    time += 0.012;
    
    // Rotación muy sutil del mensaje central para dar vida (1 grado cada cierto tiempo)
    messageGroup.rotation.y = Math.sin(time * 0.2) * 0.1;
    messageGroup.rotation.x = Math.sin(time * 0.25) * 0.05;
    
    // Rotación de las estrellas orbitantes (simulando movimiento)
    const positions = orbitingStars.geometry.attributes.position.array;
    for (let i = 0; i < orbCount; i++) {
      const speed = 0.003;
      const angleDelta = time * speed;
      // Movimiento orbital simple alrededor del eje Y
      const x = orbPositions[i*3];
      const z = orbPositions[i*3+2];
      const newX = x * Math.cos(angleDelta) + z * Math.sin(angleDelta);
      const newZ = -x * Math.sin(angleDelta) + z * Math.cos(angleDelta);
      positions[i*3] = newX;
      positions[i*3+2] = newZ;
    }
    orbitingStars.geometry.attributes.position.needsUpdate = true;
    
    // Efecto de brillo en las partículas flotantes
    glowParticles.rotation.y += 0.001;
    stars.rotation.y += 0.0003;
    stars.rotation.x += 0.0002;
    
    effectComposer.render();
  }
  
  animateParticles();
  
  // --- Control de música (solo empieza al hacer clic en play) ---
  const audioEl = document.getElementById('bgAudio');
  const playBtn = document.getElementById('playBtn');
  const progressFill = document.getElementById('progressFill');
  const progressContainer = document.getElementById('progressContainer');
  const timeSpan = document.getElementById('timeDisplay');
  
  function updateButtonUI() {
    playBtn.textContent = audioEl.paused ? '▶' : '⏸';
  }
  
  playBtn.addEventListener('click', () => {
    if (audioEl.paused) {
      audioEl.play();
    } else {
      audioEl.pause();
    }
    updateButtonUI();
  });
  
  audioEl.addEventListener('timeupdate', () => {
    if (audioEl.duration) {
      const percent = (audioEl.currentTime / audioEl.duration) * 100;
      progressFill.style.width = percent + '%';
      const curM = Math.floor(audioEl.currentTime / 60);
      const curS = Math.floor(audioEl.currentTime % 60);
      const durM = Math.floor(audioEl.duration / 60);
      const durS = Math.floor(audioEl.duration % 60);
      timeSpan.textContent = `${curM}:${curS.toString().padStart(2,'0')} / ${durM}:${durS.toString().padStart(2,'0')}`;
    }
  });
  
  progressContainer.addEventListener('click', (e) => {
    if (audioEl.duration) {
      const rect = progressContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const percent = x / rect.width;
      audioEl.currentTime = percent * audioEl.duration;
    }
  });
  
  audioEl.addEventListener('ended', updateButtonUI);
  audioEl.addEventListener('play', updateButtonUI);
  audioEl.addEventListener('pause', updateButtonUI);
  
  // No reproducir automáticamente
  // Aseguramos que no empiece sola
  audioEl.pause();
  updateButtonUI();
  
  // Ajuste responsive de la cámara
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    effectComposer.setSize(window.innerWidth, window.innerHeight);
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
