<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bajo el cielo de Saturno</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@300;400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0806;
            color: #fff5e6;
            overflow: hidden;
            height: 100vh;
            perspective: 1000px;
        }

        .font-headline {
            font-family: 'Space Grotesk', sans-serif;
        }

        .glass-morphism {
            background: rgba(16, 14, 10, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .text-glow {
            text-shadow: 0 0 10px rgba(255, 173, 51, 0.5), 0 0 20px rgba(255, 173, 51, 0.3);
        }

        .text-glow-accent {
            text-shadow: 0 0 10px rgba(230, 46, 0, 0.5), 0 0 20px rgba(230, 46, 0, 0.3);
        }

        .meteor-trail {
            position: absolute;
            pointer-events: none;
            background: linear-gradient(to right, transparent, rgba(255, 173, 51, 0.8), #fff);
            height: 2px;
            width: 150px;
            transform: rotate(-45deg);
            filter: blur(1px);
        }

        @keyframes meteor-fall {
            0% {
                transform: translate(100px, -200px) rotate(45deg);
                opacity: 0;
            }
            15% {
                opacity: 0.4;
            }
            85% {
                opacity: 0.4;
            }
            100% {
                transform: translate(-800px, 1200px) rotate(45deg);
                opacity: 0;
            }
        }

        @keyframes float-msg {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.02);
            }
        }

        .animate-meteor {
            animation: meteor-fall linear infinite;
        }

        .animate-float-slow {
            animation: float-msg 12s ease-in-out infinite;
        }

        /* Canvas container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Meteor overlay */
        #meteor-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 10;
        }

        .meteor-item {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            top: -20%;
        }

        .meteor-item .meteor-trail {
            opacity: 0.3;
            transform: scale(0.75) rotate(-45deg);
        }

        .meteor-item span {
            margin-top: 2rem;
            color: rgba(255, 173, 51, 0.5);
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.6em;
            font-size: 9px;
            white-space: nowrap;
        }

        @media (min-width: 768px) {
            .meteor-item span {
                font-size: 11px;
            }
        }

        /* HUD */
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            pointer-events: none;
            padding: 0 1rem;
        }

        #hud-content {
            text-align: center;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            max-width: 672px;
        }

        #title-container {
            transition: all 3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #title-container.hidden {
            opacity: 0;
            transform: translateY(-80px) scale(0.9);
            filter: blur(40px);
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }

        #title-container h1 {
            font-size: 2.25rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            color: #FFAD33;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 1rem;
        }

        #title-container h1 .accent {
            color: #E62E00;
        }

        #title-container p {
            color: rgba(255, 173, 51, 0.6);
            letter-spacing: 0.6em;
            font-size: 10px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        @media (min-width: 768px) {
            #title-container h1 {
                font-size: 3.75rem;
            }
        }

        @media (min-width: 1024px) {
            #title-container h1 {
                font-size: 4.5rem;
            }
        }

        #message-container {
            max-width: 448px;
            margin: 0 auto;
            transition: all 4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(64px) scale(0.95);
            opacity: 0;
        }

        #message-container.visible {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        #message-container .glass-morphism {
            padding: 2rem 1.5rem;
            border-radius: 2.5rem;
            border-color: rgba(255, 173, 51, 0.1);
            position: relative;
            overflow: hidden;
        }

        #message-container .glass-morphism .accent-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255, 173, 51, 0.4), transparent);
        }

        #message-container .glass-morphism p {
            color: rgba(255, 173, 51, 0.9);
            font-size: 0.875rem;
            line-height: 1.625;
            font-style: italic;
            text-align: left;
            letter-spacing: 0.025em;
        }

        @media (min-width: 768px) {
            #message-container .glass-morphism {
                padding: 3rem;
            }
            #message-container .glass-morphism p {
                font-size: 1rem;
            }
        }

        #message-container .footer {
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 173, 51, 0.1);
            padding-top: 1.5rem;
        }

        #message-container .footer .dots {
            display: flex;
            gap: 0.5rem;
        }

        #message-container .footer .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 173, 51, 0.3);
        }

        #message-container .footer .label {
            font-size: 10px;
            color: rgba(255, 173, 51, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.4em;
            font-family: 'Space Grotesk', sans-serif;
        }

        #bottom-decoration {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 3rem;
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #bottom-decoration.faded {
            opacity: 0.2;
            transform: scale(0.75);
            filter: blur(4px);
        }

        #bottom-decoration .line {
            height: 1px;
            width: 64px;
            background: rgba(255, 173, 51, 0.1);
        }

        #bottom-decoration .icon-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            border-radius: 50%;
            border: 1px solid rgba(255, 173, 51, 0.1);
        }

        #bottom-decoration .icon-container svg {
            width: 1rem;
            height: 1rem;
            color: rgba(255, 173, 51, 0.3);
        }

        #bottom-decoration .icon-container .pulse {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            background: rgba(230, 46, 0, 0.05);
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body>
    <!-- Canvas 3D -->
    <div id="canvas-container"></div>

    <!-- Meteor Overlay -->
    <div id="meteor-overlay"></div>

    <!-- HUD -->
    <div id="hud">
        <div id="hud-content">
            <div class="relative inline-block pointer-events-auto cursor-default w-full">
                <!-- Title -->
                <div id="title-container">
                    <h1>
                        Bajo el cielo <br />
                        <span class="accent text-glow-accent">de Saturno</span>
                    </h1>
                    <p>Donde las palabras orbitan tu corazón</p>
                </div>

                <!-- Message -->
                <div id="message-container">
                    <div class="glass-morphism animate-float-slow">
                        <div class="accent-line"></div>
                        <p>
                            "En la inmensidad de los anillos encontré el eco de tu voz. Eres la gravedad que mantiene unido mi universo, la luz que atraviesa el vacío de Saturno y la promesa de un eterno retorno."
                        </p>
                        <div class="footer">
                            <div class="dots">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <span class="label">— Crónicas de la Órbita</span>
                        </div>
                    </div>
                </div>

                <!-- Bottom Decoration -->
                <div id="bottom-decoration">
                    <div class="line"></div>
                    <div class="icon-container">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                        <div class="pulse"></div>
                    </div>
                    <div class="line"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // 1. THREE.JS - Cosmic Canvas
        // ============================================
        (function() {
            const container = document.getElementById('canvas-container');

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.0005);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 15);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ReinhardToneMapping;
            renderer.toneMappingExposure = 1.4;
            container.appendChild(renderer.domElement);

            // Controls
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enablePan = false;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.4;
            controls.enableZoom = false;

            // Lights
            scene.add(new THREE.AmbientLight(0x333344, 1.2));
            const mainLight = new THREE.DirectionalLight(0xfff0dd, 2);
            mainLight.position.set(5, 10, 5);
            scene.add(mainLight);

            // Stars
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 5000;
            const starPos = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                starPos[i * 3] = (Math.random() - 0.5) * 500;
                starPos[i * 3 + 1] = (Math.random() - 0.5) * 500;
                starPos[i * 3 + 2] = (Math.random() - 0.5) * 500;
            }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMaterial = new THREE.PointsMaterial({
                size: 0.15,
                color: 0xffffff,
                transparent: true,
                opacity: 0.8
            });
            scene.add(new THREE.Points(starGeometry, starMaterial));

            // Saturn
            const saturnGroup = new THREE.Group();
            const planet = new THREE.Mesh(
                new THREE.SphereGeometry(1.4, 64, 64),
                new THREE.MeshStandardMaterial({ color: 0xe2c9a7, roughness: 0.6, metalness: 0.2 })
            );
            saturnGroup.add(planet);

            const ringData = [
                { radius: 2.2, tube: 0.4, color: 0xc99e6f, opacity: 0.7 },
                { radius: 2.6, tube: 0.25, color: 0xe8c49a, opacity: 0.6 },
            ];
            ringData.forEach(r => {
                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(r.radius, r.tube, 2, 128),
                    new THREE.MeshStandardMaterial({
                        color: r.color,
                        transparent: true,
                        opacity: r.opacity,
                        side: THREE.DoubleSide
                    })
                );
                ring.rotation.x = Math.PI / 2;
                saturnGroup.add(ring);
            });
            scene.add(saturnGroup);

            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                saturnGroup.rotation.y += 0.0015;
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            // Resize handler
            function handleResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
            window.addEventListener('resize', handleResize);
        })();

        // ============================================
        // 2. Meteor Overlay
        // ============================================
        (function() {
            const container = document.getElementById('meteor-overlay');
            const words = [
                "Amor eterno", "Polvo de estrellas", "Luz infinita",
                "Sueño orbital", "Gravedad", "Silencio", "Cosmos",
                "Suspiro", "Aurora", "Destello", "Nebulosa",
                "Eternidad", "Galaxia", "Crepúsculo", "Susurro"
            ];
            let wordIndex = 0;

            function getNextWord() {
                const word = words[wordIndex % words.length];
                wordIndex++;
                return word;
            }

            function spawnMeteors() {
                const meteors = [];
                for (let i = 0; i < 3; i++) {
                    const text = getNextWord();
                    const meteor = document.createElement('div');
                    meteor.className = 'meteor-item animate-meteor';
                    meteor.style.left = `${15 + Math.random() * 70}%`;
                    meteor.style.animationDelay = `${i * 1.5}s`;
                    meteor.style.animationDuration = `${14 + Math.random() * 6}s`;

                    const trail = document.createElement('div');
                    trail.className = 'meteor-trail';
                    trail.style.opacity = '0.3';
                    trail.style.transform = 'scale(0.75) rotate(-45deg)';

                    const textEl = document.createElement('span');
                    textEl.textContent = text;
                    textEl.className = 'text-glow';

                    meteor.appendChild(trail);
                    meteor.appendChild(textEl);
                    container.appendChild(meteor);

                    // Auto-remove after animation
                    setTimeout(() => {
                        if (meteor.parentNode) meteor.remove();
                    }, parseFloat(meteor.style.animationDuration) * 1000 + 2000);
                }
            }

            // Initial spawns
            setTimeout(spawnMeteors, 1000);
            setTimeout(spawnMeteors, 3000);

            // Regular intervals
            setInterval(spawnMeteors, 5000);

            // Keep word rotation fresh
            setInterval(() => {
                // Shuffle words occasionally for variety
                for (let i = words.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [words[i], words[j]] = [words[j], words[i]];
                }
            }, 30000);
        })();

        // ============================================
        // 3. Floating HUD
        // ============================================
        (function() {
            const hudContent = document.getElementById('hud-content');
            const titleContainer = document.getElementById('title-container');
            const messageContainer = document.getElementById('message-container');
            const bottomDecoration = document.getElementById('bottom-decoration');

            // Mouse parallax
            let mouseX = 0,
                mouseY = 0;
            let targetX = 0,
                targetY = 0;

            document.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth - 0.5) * 6;
                mouseY = (e.clientY / window.innerHeight - 0.5) * 3;
            });

            function updateParallax() {
                targetX += (mouseX - targetX) * 0.05;
                targetY += (mouseY - targetY) * 0.05;
                hudContent.style.transform =
                    `rotateY(${targetX}deg) rotateX(${-targetY}deg)`;
                requestAnimationFrame(updateParallax);
            }
            updateParallax();

            // Animation sequence
            setTimeout(() => {
                messageContainer.classList.add('visible');
            }, 6000);

            setTimeout(() => {
                titleContainer.classList.add('hidden');
                bottomDecoration.classList.add('faded');
            }, 10000);
        })();
    </script>
</body>
</html>
