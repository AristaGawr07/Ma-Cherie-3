<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>25 Mois - Notre Voyage</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', 'Corbel', 'Arial', sans-serif;
  }
  
  .ui-panel {
    position: fixed;
    top: 20px;
    left: 0;
    width: 100%;
    text-align: center;
    pointer-events: none;
    z-index: 20;
    text-shadow: 0 0 15px rgba(0,0,0,0.5);
  }
  
  .title-25 {
    font-size: clamp(1.6rem, 6vw, 3rem);
    font-weight: 300;
    letter-spacing: 6px;
    background: linear-gradient(135deg, #ffd6a5, #f5b7a8);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(255, 180, 100, 0.4);
    margin-bottom: 8px;
  }
  
  .sub {
    font-size: clamp(0.7rem, 3vw, 0.9rem);
    color: #ffccaa;
    letter-spacing: 2px;
    opacity: 0.8;
  }
  
  .music-controls {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 15, 30, 0.85);
    backdrop-filter: blur(16px);
    border-radius: 60px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid rgba(255, 210, 160, 0.4);
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    z-index: 100;
    font-family: monospace;
    pointer-events: auto;
  }
  
  .play-pause {
    background: linear-gradient(135deg, #f5a97f, #e07a5f);
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: white;
    font-size: 18px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 12px rgba(240, 100, 70, 0.6);
  }
  
  .play-pause:hover {
    transform: scale(1.05);
    background: linear-gradient(135deg, #f7b787, #e8876a);
  }
  
  .progress-bar-bg {
    flex: 1;
    width: 180px;
    max-width: 260px;
    height: 4px;
    background: rgba(255,255,240,0.25);
    border-radius: 4px;
    cursor: pointer;
  }
  
  .progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #ffb48a, #ff8c6b);
    border-radius: 4px;
  }
  
  .time-text {
    font-size: 11px;
    color: #ffddbb;
    min-width: 80px;
    text-align: right;
    letter-spacing: 1px;
  }
  
  .volume-control {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.4);
    padding: 4px 12px;
    border-radius: 40px;
    margin-left: 5px;
  }
  
  .volume-icon {
    color: #ffccaa;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
  }
  
  .volume-slider {
    width: 70px;
    height: 3px;
    -webkit-appearance: none;
    background: rgba(255,255,240,0.3);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ffb48a;
    cursor: pointer;
    box-shadow: 0 0 5px #ffaa77;
  }
  
  @media (max-width: 650px) {
    .volume-control { padding: 2px 8px; }
    .volume-slider { width: 50px; }
    .progress-bar-bg { width: 120px; }
    .time-text { font-size: 9px; min-width: 70px; }
    .play-pause { width: 38px; height: 38px; font-size: 16px; }
    .music-controls { padding: 6px 14px; gap: 10px; }
  }
  
  @media (max-width: 500px) {
    .volume-slider { width: 40px; }
    .volume-icon { font-size: 11px; }
    .volume-control { gap: 4px; }
  }
  
  .rotate-hint {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    padding: 4px 12px;
    border-radius: 40px;
    font-size: 11px;
    color: #ffd4aa;
    letter-spacing: 1px;
    font-family: monospace;
    pointer-events: none;
    z-index: 99;
    white-space: nowrap;
  }
  
  @media (max-width: 500px) {
    .rotate-hint { bottom: 80px; font-size: 9px; }
  }
</style>
</head>
<body>
<div class="ui-panel">
  <div class="title-25">25 MOIS • NOTRE HISTOIRE</div>
  <div class="sub">L'AMOUR N'A PAS DE FRONTIÈRES</div>
</div>
<div class="music-controls">
  <button class="play-pause" id="playBtn">▶</button>
  <div class="progress-bar-bg" id="progressContainer">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="time-text" id="timeDisplay">0:00 / 0:00</div>
  <div class="volume-control">
    <span class="volume-icon" id="volumeIcon">🔊</span>
    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
  </div>
</div>
<div class="rotate-hint">〰️ Gira el mensaje con el ratón 〰️</div>

<audio id="bgAudio" loop preload="auto">
  <source src="https://files.catbox.moe/pgafel.mp3" type="audio/mpeg">
</audio>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  
  // --- Escena espacial romántica ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050518);
  scene.fog = new THREE.FogExp2(0x050518, 0.002);
  
  const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0.5, 5.5);
  camera.lookAt(0, 0, 0);
  
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);
  
  // --- Efecto Bloom ---
  const renderScene = new RenderPass(scene, camera);
  const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.3, 0.7);
  bloomPass.threshold = 0.2;
  bloomPass.strength = 0.45;
  bloomPass.radius = 0.4;
  const effectComposer = new EffectComposer(renderer);
  effectComposer.addPass(renderScene);
  effectComposer.addPass(bloomPass);
  
  // --- Control interactivo ---
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.rotateSpeed = 1.2;
  controls.zoomSpeed = 1.0;
  controls.enableZoom = true;
  controls.enablePan = false;
  controls.autoRotate = false;
  controls.target.set(0, 0, 0);
  controls.maxDistance = 8;
  controls.minDistance = 2.5;
  
  // --- Fondo de estrellas ---
  const starCount = 3500;
  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    starPos[i*3] = (Math.random() - 0.5) * 450;
    starPos[i*3+1] = (Math.random() - 0.5) * 280;
    starPos[i*3+2] = (Math.random() - 0.5) * 200 - 80;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.11, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);
  
  // --- Partículas doradas ---
  const glowCount = 1200;
  const glowGeo = new THREE.BufferGeometry();
  const glowPositions = new Float32Array(glowCount * 3);
  for (let i = 0; i < glowCount; i++) {
    glowPositions[i*3] = (Math.random() - 0.5) * 22;
    glowPositions[i*3+1] = (Math.random() - 0.5) * 16;
    glowPositions[i*3+2] = (Math.random() - 0.5) * 18 - 5;
  }
  glowGeo.setAttribute('position', new THREE.BufferAttribute(glowPositions, 3));
  const glowMat = new THREE.PointsMaterial({ color: 0xffaa77, size: 0.03, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
  const glowParticles = new THREE.Points(glowGeo, glowMat);
  scene.add(glowParticles);
  
  // ========== TEXTO LADO A (FRANCÉS) - Cara frontal ==========
  const textA = `✦ 25 MOIS ✦

MON AMOUR, MA CHÉRIE

DEPUIS 25 LUNES
TU FAIS BRILLER MES JOURS

CHAQUE INSTANT AVEC TOI
EST UNE ÉTOILE DANS MON CIEL

JE T'AIME PLUS CHAQUE JOUR

♡ MON TRÉSOR ♡`;
  
  // ========== TEXTO LADO B (ITALIANO) - Cara trasera ==========
  const textB = `✦ PER SEMPRE ✦

AMORE MIO, TESORO MIO

25 MESI DI MAGIA
INSIEME ABBIAMO
DIPINTO L'INFINITO

LA TUA MANO NELLA MIA
È LA MIA CASA

JE T'AIME MON AMOUR

❤️ AMORE MIO ❤️`;
  
  // Función para crear textura con texto (mejorada)
  function createTextTexture(content, bgColor1, bgColor2, borderColor, textColorLight, textColorDark) {
    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 1024;
    const ctx = canvas.getContext('2d');
    
    // Fondo con gradiente radial para dar profundidad
    const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width/2);
    grad.addColorStop(0, bgColor1);
    grad.addColorStop(1, bgColor2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Borde decorativo doble
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 8;
    ctx.strokeRect(35, 35, canvas.width - 70, canvas.height - 70);
    ctx.strokeStyle = '#ffffff30';
    ctx.lineWidth = 2;
    ctx.strokeRect(45, 45, canvas.width - 90, canvas.height - 90);
    
    // Dibujar líneas de texto
    const lines = content.split('\n');
    const lineHeight = 72;
    const startY = canvas.height / 2 - (lines.length * lineHeight) / 2;
    
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    lines.forEach((line, idx) => {
      const yPos = startY + idx * lineHeight;
      
      if (line.includes('✦') || line.includes('❤️') || line.includes('♡')) {
        ctx.font = `56px "Segoe UI", "Corbel", "Arial", sans-serif`;
        ctx.fillStyle = '#ffcf9a';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ffaa77';
        ctx.fillText(line, canvas.width/2, yPos);
        ctx.shadowBlur = 0;
      } 
      else if (line.includes('MON AMOUR') || line.includes('AMORE MIO') || line.includes('MA CHÉRIE') || line.includes('TESORO MIO')) {
        ctx.font = `48px "Segoe UI", "Corbel", "Arial", sans-serif`;
        ctx.fillStyle = '#ffaa88';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff8866';
        ctx.fillText(line, canvas.width/2, yPos);
        ctx.shadowBlur = 0;
      }
      else if (line.includes('JE T') || line.includes('TI AMO')) {
        ctx.font = `46px "Segoe UI", "Corbel", "Arial", sans-serif`;
        ctx.fillStyle = '#ffbb99';
        ctx.fillText(line, canvas.width/2, yPos);
      }
      else if (line.trim() === '') {
        return;
      }
      else {
        ctx.font = `34px "Segoe UI", "Corbel", "Arial", sans-serif`;
        ctx.fillStyle = textColorLight;
        ctx.fillText(line, canvas.width/2, yPos);
        ctx.fillStyle = textColorDark;
        ctx.fillText(line, canvas.width/2 + 2, yPos + 2);
      }
    });
    
    // Decoraciones en las esquinas
    ctx.font = `38px "Segoe UI"`;
    ctx.fillStyle = '#ffaa88';
    ctx.fillText("✨", canvas.width/2 - 130, canvas.height - 65);
    ctx.fillText("✨", canvas.width/2 + 130, canvas.height - 65);
    ctx.fillStyle = '#ff88aa';
    ctx.fillText("⭐", canvas.width/2 - 140, 75);
    ctx.fillText("⭐", canvas.width/2 + 140, 75);
    
    const texture = new THREE.CanvasTexture(canvas);
    texture.needsUpdate = true;
    return texture;
  }
  
  // Crear texturas con colores distintos para cada lado
  const textureA = createTextTexture(
    textA,
    '#2a1a35', '#1a0f25',
    '#ffc49b',
    '#ffe3ca', '#d4b896'
  );
  
  const textureB = createTextTexture(
    textB,
    '#1a2538', '#0f1520',
    '#aac9ff',
    '#cbe4fe', '#a0b8d4'
  );
  
  // --- Crear el mensaje como un panel plano (para que el texto se vea bien) ---
  // En lugar de un cubo, usamos un panel delgado con dos caras
  const messageGroup = new THREE.Group();
  
  // Panel frontal (Cara A)
  const frontGeometry = new THREE.PlaneGeometry(2.8, 2.8);
  const frontMaterial = new THREE.MeshStandardMaterial({ 
    map: textureA, 
    side: THREE.DoubleSide,
    roughness: 0.3,
    metalness: 0.1,
    emissive: '#2a1a35',
    emissiveIntensity: 0.2,
    transparent: true
  });
  const frontPanel = new THREE.Mesh(frontGeometry, frontMaterial);
  frontPanel.position.z = 0.05;
  messageGroup.add(frontPanel);
  
  // Panel trasero (Cara B)
  const backGeometry = new THREE.PlaneGeometry(2.8, 2.8);
  const backMaterial = new THREE.MeshStandardMaterial({ 
    map: textureB, 
    side: THREE.DoubleSide,
    roughness: 0.3,
    metalness: 0.1,
    emissive: '#1a2538',
    emissiveIntensity: 0.2,
    transparent: true
  });
  const backPanel = new THREE.Mesh(backGeometry, backMaterial);
  backPanel.position.z = -0.05;
  backPanel.rotation.y = Math.PI;
  messageGroup.add(backPanel);
  
  // Borde decorativo del mensaje (marco)
  const frameGeo = new THREE.BoxGeometry(2.95, 2.95, 0.08);
  const frameMat = new THREE.MeshStandardMaterial({ color: 0xc98a6e, metalness: 0.6, roughness: 0.4, emissive: '#442200', emissiveIntensity: 0.1 });
  const frame = new THREE.Mesh(frameGeo, frameMat);
  messageGroup.add(frame);
  
  scene.add(messageGroup);
  
  // --- Partículas alrededor del mensaje (anillo brillante) ---
  const particleRingCount = 300;
  const ringGeo = new THREE.BufferGeometry();
  const ringPositions = new Float32Array(particleRingCount * 3);
  for (let i = 0; i < particleRingCount; i++) {
    const angle = (i / particleRingCount) * Math.PI * 2;
    const radius = 1.9;
    ringPositions[i*3] = Math.cos(angle) * radius;
    ringPositions[i*3+1] = Math.sin(angle) * radius * 0.4;
    ringPositions[i*3+2] = 0;
  }
  ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
  const ringParticleMat = new THREE.PointsMaterial({ color: 0xffaa88, size: 0.025, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
  const ringParticles = new THREE.Points(ringGeo, ringParticleMat);
  messageGroup.add(ringParticles);
  
  // --- Estrellitas orbitando alrededor del mensaje ---
  const orbCount = 200;
  const orbPositions = new Float32Array(orbCount * 3);
  for (let i = 0; i < orbCount; i++) {
    const r = 2.2 + Math.random() * 0.7;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI * 2;
    orbPositions[i*3] = Math.sin(theta) * Math.cos(phi) * r;
    orbPositions[i*3+1] = Math.sin(theta) * Math.sin(phi) * r * 0.5;
    orbPositions[i*3+2] = Math.cos(theta) * r;
  }
  const orbBufferGeo = new THREE.BufferGeometry();
  orbBufferGeo.setAttribute('position', new THREE.BufferAttribute(orbPositions, 3));
  const orbMatStars = new THREE.PointsMaterial({ color: 0xffc89c, size: 0.028, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
  const orbitingStarsObj = new THREE.Points(orbBufferGeo, orbMatStars);
  scene.add(orbitingStarsObj);
  
  const originalOrbPos = orbPositions.slice();
  
  // --- Iluminación ---
  const ambientLight = new THREE.AmbientLight(0x22223b);
  scene.add(ambientLight);
  const mainLight = new THREE.DirectionalLight(0xffeedd, 1.0);
  mainLight.position.set(4, 8, 5);
  scene.add(mainLight);
  const fillLight = new THREE.PointLight(0xffaa77, 0.5);
  fillLight.position.set(1, 1, 2);
  scene.add(fillLight);
  const backLight = new THREE.PointLight(0x6688ff, 0.4);
  backLight.position.set(0, 1, -4);
  scene.add(backLight);
  
  // --- Animación ---
  let time = 0;
  
  function animateScene() {
    requestAnimationFrame(animateScene);
    time += 0.012;
    
    // Rotación suave del mensaje
    messageGroup.rotation.y = Math.sin(time * 0.15) * 0.1;
    messageGroup.rotation.x = Math.sin(time * 0.2) * 0.05;
    
    // Rotación de las partículas del anillo
    ringParticles.rotation.z = time * 0.3;
    
    // Movimiento orbital de las estrellitas
    const positions = orbitingStarsObj.geometry.attributes.position.array;
    for (let i = 0; i < orbCount; i++) {
      const origX = originalOrbPos[i*3];
      const origZ = originalOrbPos[i*3+2];
      const angle = time * 0.5;
      const newX = origX * Math.cos(angle) + origZ * Math.sin(angle);
      const newZ = -origX * Math.sin(angle) + origZ * Math.cos(angle);
      positions[i*3] = newX;
      positions[i*3+2] = newZ;
    }
    orbitingStarsObj.geometry.attributes.position.needsUpdate = true;
    
    // Movimiento del fondo
    stars.rotation.y += 0.0002;
    stars.rotation.x += 0.0001;
    glowParticles.rotation.y += 0.0004;
    
    effectComposer.render();
  }
  
  animateScene();
  
  // --- Control de música ---
  const audioEl = document.getElementById('bgAudio');
  const playBtn = document.getElementById('playBtn');
  const progressFill = document.getElementById('progressFill');
  const progressContainer = document.getElementById('progressContainer');
  const timeSpan = document.getElementById('timeDisplay');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeIcon = document.getElementById('volumeIcon');
  
  audioEl.volume = 0.7;
  volumeSlider.value = 0.7;
  
  function updateButtonUI() {
    playBtn.textContent = audioEl.paused ? '▶' : '⏸';
  }
  
  playBtn.addEventListener('click', () => {
    if (audioEl.paused) {
      audioEl.play().catch(e => console.log('Error al reproducir:', e));
    } else {
      audioEl.pause();
    }
    updateButtonUI();
  });
  
  audioEl.addEventListener('timeupdate', () => {
    if (audioEl.duration) {
      const percent = (audioEl.currentTime / audioEl.duration) * 100;
      progressFill.style.width = percent + '%';
      const curM = Math.floor(audioEl.currentTime / 60);
      const curS = Math.floor(audioEl.currentTime % 60);
      const durM = Math.floor(audioEl.duration / 60);
      const durS = Math.floor(audioEl.duration % 60);
      timeSpan.textContent = `${curM}:${curS.toString().padStart(2,'0')} / ${durM}:${durS.toString().padStart(2,'0')}`;
    }
  });
  
  progressContainer.addEventListener('click', (e) => {
    if (audioEl.duration) {
      const rect = progressContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const percent = x / rect.width;
      audioEl.currentTime = percent * audioEl.duration;
    }
  });
  
  volumeSlider.addEventListener('input', (e) => {
    const vol = parseFloat(e.target.value);
    audioEl.volume = vol;
    volumeIcon.textContent = vol === 0 ? '🔇' : (vol < 0.3 ? '🔈' : '🔊');
  });
  
  volumeIcon.addEventListener('click', () => {
    if (audioEl.volume > 0) {
      audioEl.volume = 0;
      volumeSlider.value = 0;
      volumeIcon.textContent = '🔇';
    } else {
      audioEl.volume = 0.7;
      volumeSlider.value = 0.7;
      volumeIcon.textContent = '🔊';
    }
  });
  
  audioEl.addEventListener('ended', updateButtonUI);
  audioEl.addEventListener('play', updateButtonUI);
  audioEl.addEventListener('pause', updateButtonUI);
  
  audioEl.pause();
  updateButtonUI();
  
  // Refrescar texturas cada segundo para asegurar que se muestren
  setInterval(() => {
    textureA.needsUpdate = true;
    textureB.needsUpdate = true;
  }, 1000);
  
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    effectComposer.setSize(window.innerWidth, window.innerHeight);
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
